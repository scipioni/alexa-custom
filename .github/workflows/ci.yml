name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: ruff check
        run: uvx ruff@0.8.0 check .
      - name: ruff format --check
        run: uvx ruff@0.8.0 format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install system audio libraries
        # sounddevice (PortAudio) and pulsectl (libpulse) load shared libs at
        # import time; without these, importing the package fails.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libpulse0
      - run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests/ -q

  typecheck:
    runs-on: ubuntu-latest
    # Non-blocking: the codebase is mid-migration to clean types. This job
    # surfaces the remaining errors without failing the build. Remove
    # continue-on-error once the count reaches zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libpulse0
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: pyright
        run: uv run pyright alexa_custom/
