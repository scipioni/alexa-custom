version: '3'

vars:
  VENV_SITE: .venv/lib/python3.14/site-packages
  PYTHONPATH: ".:{{.VENV_SITE}}"
  PYTEST: pytest

tasks:
  test:
    desc: Run regression tests
    cmds:
      - PYTHONPATH={{.PYTHONPATH}} {{.PYTEST}} tests/

  test-stt-e2e:
    desc: Run E2E STT tests (synthesises speech with piper, feeds through STT backend)
    cmds:
      - PYTHONPATH={{.PYTHONPATH}} {{.PYTEST}} tests/test_stt_e2e.py -v -s

  lint:
    desc: Run ruff for linting and formatting
    cmds:
      - ruff check .
      - ruff format --check .

  format:
    desc: Format code with ruff
    cmds:
      - ruff format .

  fix:
    desc: Auto-fix lint issues, format, and run tests
    cmds:
      - ruff check --fix .
      - ruff format .
      - PYTHONPATH={{.PYTHONPATH}} {{.PYTEST}} tests/

  run:
    desc: Run the alexa-client (loads from conf/config.yaml)
    cmds:
      - PYTHONPATH={{.PYTHONPATH}} python3 alexa_custom/client.py {{.CLI_ARGS}}

  release:patch:
    desc: Bump patch version (x.y.Z+1), commit and tag
    cmds:
      - task: _release
        vars: { BUMP: patch }

  release:minor:
    desc: Bump minor version (x.Y+1.0), commit and tag
    cmds:
      - task: _release
        vars: { BUMP: minor }

  release:major:
    desc: Bump major version (X+1.0.0), commit and tag
    cmds:
      - task: _release
        vars: { BUMP: major }

  release:rollback:
    desc: Delete the latest release tag and undo its commit
    cmds:
      - |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ -z "$TAG" ]; then
          echo "No tags found — nothing to rollback"
          exit 1
        fi
        COMMIT=$(git rev-list -n 1 "$TAG")
        MSG=$(git log -1 --pretty=%s "$COMMIT")
        echo "Rolling back tag ${TAG} (${COMMIT:0:7}: ${MSG})"
        git tag -d "$TAG"
        git revert --no-edit "$COMMIT"
        echo ""
        echo "Tag ${TAG} deleted and release commit reverted"
        echo "Push with: git push && git push origin :refs/tags/${TAG}"

  _release:
    internal: true
    cmds:
      - |
        CURRENT=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        MAJOR=$(echo $CURRENT | cut -d. -f1)
        MINOR=$(echo $CURRENT | cut -d. -f2)
        PATCH=$(echo $CURRENT | cut -d. -f3)
        case "{{.BUMP}}" in
          major) NEW="$((MAJOR+1)).0.0" ;;
          minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
          patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          *) echo "Unknown bump type: {{.BUMP}}"; exit 1 ;;
        esac
        sed -i "s/^version = \".*\"/version = \"${NEW}\"/" pyproject.toml

        PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
        if [ -n "$PREV" ]; then
          TODAY=$(date +%Y-%m-%d)
          FEATS=$(git log --oneline --no-merges "${PREV}..HEAD" | sed -n 's/^[0-9a-f]* feat\(([^)]*)\)\?: //p' || true)
          FIXES=$(git log --oneline --no-merges "${PREV}..HEAD" | sed -n 's/^[0-9a-f]* fix\(([^)]*)\)\?: //p' || true)
          {
            echo "## [${NEW}] - ${TODAY}"
            echo ""
            if [ -n "$FEATS" ]; then
              echo "### Added"
              echo "$FEATS" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixed"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi
          } > /tmp/changelog_entry.tmp
          if [ -f CHANGELOG.md ]; then
            sed -i "/^## \[Unreleased\]/r /tmp/changelog_entry.tmp" CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to this project will be documented in this file."
              echo ""
              echo "## [Unreleased]"
              echo ""
              echo "*No unreleased changes.*"
              echo ""
              cat /tmp/changelog_entry.tmp
            } > CHANGELOG.md
          fi
          rm -f /tmp/changelog_entry.tmp
          git add CHANGELOG.md
        fi

        git add pyproject.toml
        git commit -m "chore: release v${NEW}"
        git tag -a "v${NEW}" -m "Release v${NEW}"
        echo ""
        echo "Released v${NEW}"
        echo "Push with: git push && git push --tags"

  setup:
    desc: Install the alexa-custom systemd user service and enable it
    cmds:
      - mkdir -p ~/.config/systemd/user
      - cp setup/alexa-custom.service ~/.config/systemd/user/alexa-custom.service
      - systemctl --user daemon-reload
      - systemctl --user enable alexa-custom
      - |
        echo ""
        echo "Service installed. Useful commands:"
        echo "  systemctl --user start   alexa-custom   # start now"
        echo "  systemctl --user stop    alexa-custom   # stop"
        echo "  systemctl --user restart alexa-custom   # restart"
        echo "  systemctl --user status  alexa-custom   # check status"
        echo "  journalctl --user -fu    alexa-custom   # follow logs"

  audio:setup:
    desc: Set NewPie USB default sink/source persistently, unmute hardware, install PCM restore service, and disable USB autosuspend
    cmds:
      # Remove any stale switch-on-connect drop-ins (module not available on this board)
      - rm -f ~/.config/pipewire/pipewire.conf.d/99-switch-on-connect.conf
      - rm -f ~/.config/pipewire/pipewire-pulse.conf.d/99-switch-on-connect.conf
      # Disable USB autosuspend for NewPie (prevents mid-session PCM/routing resets on USB wake)
      - sudo cp setup/99-newpie-no-autosuspend.rules /etc/udev/rules.d/99-newpie-no-autosuspend.rules
      - sudo udevadm control --reload-rules
      - sudo udevadm trigger --subsystem-match=usb --attr-match=idVendor=0a12
      # Switch device from pro-audio to analog-stereo profile (pro-audio disables endpoints on NewPie)
      - pactl set-card-profile alsa_card.usb-0a12_NewPie_SABINESMICDFU-00 output:analog-stereo+input:analog-stereo || true
      # Set WirePlumber persistent default routing by name (survives reboots)
      # Must use default.configured.audio.* — WirePlumber reads these keys to restore state on restart
      - pw-metadata -n default 0 default.configured.audio.sink '{"name":"alsa_output.usb-0a12_NewPie_SABINESMICDFU-00.analog-stereo"}' 'Spa:String:JSON'
      - pw-metadata -n default 0 default.configured.audio.source '{"name":"alsa_input.usb-0a12_NewPie_SABINESMICDFU-00.analog-stereo"}' 'Spa:String:JSON'
      # Unmute hardware PCM volume now (software volume is set from conf/config.yaml at startup)
      - amixer -c 0 sset PCM 100% || amixer -c NewPie sset PCM 100% || true
      # Install user service to re-apply PCM 100% after PipeWire init on every boot
      - mkdir -p ~/.config/systemd/user
      - cp setup/alsa-pcm-unmute.service ~/.config/systemd/user/alsa-pcm-unmute.service
      - systemctl --user daemon-reload
      - systemctl --user enable alsa-pcm-unmute.service
      # Restart WirePlumber so it re-evaluates routing with NewPie as the configured default
      - systemctl --user restart wireplumber && sleep 3
      - systemctl --user restart alsa-pcm-unmute.service
      - echo "USB Audio (NewPie) configured."

  audio:restart:
    desc: Restart WirePlumber and restore NewPie routing and PCM volume
    cmds:
      - systemctl --user restart wireplumber && sleep 3
      - amixer -c 0 sset PCM 100% || true
      - systemctl --user restart alsa-pcm-unmute.service

  audio:status:
    desc: Check and display beautifully formatted status about NewPie USB audio device
    silent: true
    cmds:
      - |
        python3 -c '
        import subprocess, re, json
        status = subprocess.getoutput("wpctl status")
        default_sink = subprocess.getoutput("wpctl inspect @DEFAULT_SINK@")
        metadata = subprocess.getoutput("pw-metadata -n default")
        lsusb = subprocess.getoutput("lsusb")

        usb_match = re.search(r"Bus \d+ Device \d+: ID [0-9a-fA-F:]+ Cambridge Silicon Radio, Ltd NewPie", lsusb)
        usb_info = usb_match.group(0) if usb_match else "NewPie not found on USB bus"

        sinks_part = status.split("Sinks:")[1].split("Sources:")[0] if "Sinks:" in status else ""
        sources_part = status.split("Sources:")[1].split("Filters:")[0] if "Sources:" in status else ""

        sink_info = re.search(r"(\d+)\.\s+NewPie Analog Stereo\s+\[vol:\s+([0-9.]+)\]", sinks_part)
        source_info = re.search(r"(\d+)\.\s+NewPie Analog Stereo\s+\[vol:\s+([0-9.]+)\]", sources_part)

        sink_id = sink_info.group(1) if sink_info else "Unknown"
        sink_vol = sink_info.group(2) if sink_info else "Unknown"
        source_id = source_info.group(1) if source_info else "Unknown"
        source_vol = source_info.group(2) if source_info else "Unknown"

        active_sink_match = re.search(r"node\.name\s+=\s+\"([^\"]+)\"", default_sink)
        active_sink = active_sink_match.group(1) if active_sink_match else "Unknown"

        active_source = "Unknown"
        for line in metadata.splitlines():
            if "default.audio.source" in line:
                try:
                    val_part = line.split("value:")[1].split("type:")[0].strip().strip("\x27")
                    val_json = re.sub(r"\x27", "\x22", val_part)
                    active_source = json.loads(val_json)["name"]
                except Exception as e:
                    pass

        is_sink_default = "NewPie" in active_sink
        is_source_default = "NewPie" in active_source

        print("=========================================================")
        print(" 🔊 NEWPIE USB AUDIO STATUS")
        print("=========================================================")
        print(f"🔌 USB Device:   {usb_info}")
        print(f"🆔 Sinks & Sources:")
        print(f"   - Playback (Sink) ID:   {sink_id} (Volume: {sink_vol})")
        print(f"   - Capture (Source) ID:  {source_id} (Volume: {source_vol})")
        print(f"🎯 Active Default Routing:")
        print(f"   - Playback Sink:   \x1b[32m✅ ACTIVE DEFAULT\x1b[0m" if is_sink_default else f"\x1b[31m❌ INACTIVE\x1b[0m (Default: {active_sink})")
        print(f"   - Capture Source:  \x1b[32m✅ ACTIVE DEFAULT\x1b[0m" if is_source_default else f"\x1b[31m❌ INACTIVE\x1b[0m (Default: {active_source})")
        print("=========================================================")
        '

  audio:doctor:
    desc: Check each NewPie audio invariant (device, PCM level, routing, drop-ins, autosuspend, restore service) and report pass/fail
    cmds:
      - PYTHONPATH={{.PYTHONPATH}} python3 -m alexa_custom.audio doctor

  audio:test:
    desc: Play a test audio file (/usr/share/sounds/alsa/Front_Center.wav) to verify speaker output
    cmds:
      - echo "Playing test sound ('Front_Center.wav')..."
      - pw-play /usr/share/sounds/alsa/Front_Center.wav || aplay /usr/share/sounds/alsa/Front_Center.wav

  display:compile:
    desc: Compile uart_bridge for direct UART access (bypasses kernel driver)
    cmds:
      - gcc -o setup/display_firmware/uart_bridge setup/uart_bridge.c

  display:test:
    desc: Test UART communication with STM32 (requires sudo for /dev/mem)
    cmds:
      - |
        CMD="sudo setup/display_firmware/uart_bridge"
        # ping via MsgPack: [0, 0, "ping", []]
        printf '\x94\x00\x00\xa4ping\x90' | timeout 3 $CMD | xxd
        echo ""
        echo "Expected response starts with: 94 01 00..."

  display:setup:
    desc: Compile uart_bridge and add sudoers entry for alexa user
    cmds:
      - task: display:compile
      - |
        echo "Adding sudoers entry for uart_bridge..."
        echo "arduino ALL=(ALL) NOPASSWD: $(pwd)/setup/display_firmware/uart_bridge" | sudo tee /etc/sudoers.d/alexa-uart-bridge
        sudo chmod 440 /etc/sudoers.d/alexa-uart-bridge
        echo "Done. The display backend will auto-detect uart_bridge."

  clean:
    desc: Clean up temporary files
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - rm -rf .pytest_cache
      - rm -rf alexa_custom.egg-info
      - rm -rf build
      - rm -rf dist
