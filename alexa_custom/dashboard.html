  <script>
    (function() {
      var stored = localStorage.getItem('theme');
      var theme = stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <style>
    :root {
      --bg:      #0d0d12;
      --surface: rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.09);
      --wake:    #fb923c;
      --match:   #4ade80;
      --nomatch: #f87171;
      --skipped: #64748b;
      --info:    #60a5fa;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --amber:   #facc15;
      --llm:     #a78bfa;
      --llm-dim: rgba(167,139,250,0.15);
      --llm-border: rgba(167,139,250,0.3);
      --bar-bg:      rgba(0,0,0,0.35);
      --transcribing: #94a3b8;
      --reply-trig:   #86efac;
      --electric-yellow: #facc15;
      --glow-green: #4ade80;
      --pill-red: #f87171;
      --glow-shadow: drop-shadow(0 0 8px rgba(250,204,21,0.5));
      --panel-shadow: 0 4px 28px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
      --panel-accent: rgba(96,165,250,0.25);
      --hdr-bg: rgba(255,255,255,0.02);
    }

    [data-theme="light"] {
      --bg:           #eef1f6;
      --surface:      rgba(255,255,255,0.82);
      --border:       rgba(0,0,0,0.09);
      --text:         #0f172a;
      --muted:        #64748b;
      --bar-bg:       rgba(255,255,255,0.75);
      --transcribing: #475569;
      --reply-trig:   #16a34a;
      --panel-shadow: 0 2px 16px rgba(0,0,0,0.08), 0 1px 0 rgba(255,255,255,0.9) inset;
      --panel-accent: rgba(96,165,250,0.35);
      --hdr-bg: rgba(0,0,0,0.02);
    }

    body {
      transition: background-color 0.4s ease;
    }
    body, #status-bar, .panel, #hero, .ww-card, #restart-card {
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* ── status bar ─────────────────────────────────────────────────────── */
    #status-bar {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: var(--bar-bg);
      backdrop-filter: blur(16px);
      box-shadow: 0 1px 0 var(--border);
    }
    .sdot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .sdot.ok   { background: var(--match); box-shadow: 0 0 6px var(--match); }
    .sdot.warn { background: var(--wake); }
    #st   { font-size: 12px; }
    #llm-model-name { color: var(--llm); font-size: 10px; font-weight: 400; margin-left: auto; opacity: 0.85; }
    #llm-model-name.thinking { animation: llm-dot-pulse 1s ease-in-out infinite; }


    .llm-dot {
      display: inline-block;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--llm);
      animation: llm-dot-pulse 1.4s ease-in-out infinite;
      opacity: 0;
    }
    .llm-dot:nth-child(1) { animation-delay: 0s; }
    .llm-dot:nth-child(2) { animation-delay: 0.2s; }
    .llm-dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── hero STT card ──────────────────────────────────────────────────── */
    #hero {
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      transition: box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    #hero.wave-glow {
      background: rgba(96,165,250,0.06);
      border-color: rgba(96,165,250,0.25);
      box-shadow: 0 0 calc(8px * var(--glow-power, 0.5)) rgba(96,165,250,0.15), inset 0 0 calc(12px * var(--glow-power, 0.5)) rgba(96,165,250,0.04);
    }
    .hero-inner {
      display: contents;
      transition: opacity 0.15s ease-out, transform 0.2s ease-out;
    }
    .hero-inner.exit { opacity: 0; transform: translateY(-3px); }
    .hero-inner.enter { animation: hero-enter 0.2s ease-out forwards; }
    @keyframes hero-enter {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-icon { font-size: 20px; flex-shrink: 0; }
    .hero-text { font-size: 15px; flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .hero-trigger { color: var(--match); font-weight: 600; font-size: 14px; }
    .hero-muted   { color: var(--muted); }
    .cursor { display: inline-block; animation: blink 1s step-end infinite; }

    /* wake-word pill badge */
    .wake-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(251,146,60,0.15);
      border: 1px solid var(--wake);
      border-radius: 6px;
      padding: 2px 9px 2px 6px;
      color: var(--wake);
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      animation: wake-pop 0.18s ease-out;
    }
    .wake-chip-icon { font-size: 11px; opacity: 0.8; }
    @keyframes wake-pop {
      from { transform: scale(0.75); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .hero-s2 { color: var(--transcribing); font-size: 15px; }

    /* thinking dots row inside hero */
    .hero-think-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 8px;
    }
    .hero-think-dots .td {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--llm);
      animation: llm-dot-pulse 1.4s ease-in-out infinite;
      opacity: 0;
    }
    .hero-think-dots .td:nth-child(1) { animation-delay: 0s; }
    .hero-think-dots .td:nth-child(2) { animation-delay: 0.22s; }
    .hero-think-dots .td:nth-child(3) { animation-delay: 0.44s; }

    /* LLM orbit ring on hero icon */
    .llm-orb {
      position: relative; display: inline-block; flex-shrink: 0; vertical-align: middle;
    }
    .llm-orb-ring {
      position: absolute; inset: -5px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--llm);
      animation: orbit-spin 1.1s linear infinite;
    }

    /* ── two-column main grid ───────────────────────────────────────────── */
    #main {
      display: grid;
      grid-template-columns: 1fr 252px;
      gap: 8px;
      min-height: 0;
      margin: 8px 12px 0;
      flex: 1;
    }

    .center-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .center-col > #hero {
      flex-shrink: 0;
    }

    /* ── trigger tree panel ─────────────────────────────────────────────── */
    #ww-tree-panel { flex: 1; min-height: 0; }
    #ww-tree-content {
      padding: 6px 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    /* wake word group */
    .ww-group { margin-bottom: 2px; }
    .ww-card {
      border-radius: 7px;
      padding: 4px 6px;
      transition: background 0.25s, box-shadow 0.25s;
    }
    .ww-card.ww-active {
      background: rgba(251,146,60,0.06);
      box-shadow: inset 2px 0 0 var(--wake);
      animation: glow-pulse 1.2s ease-out;
    }
    .ww-node-hdr {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0 2px;
      justify-content: space-between;
    }
    .ww-node-hdr-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .ww-node-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--info);
      flex-shrink: 0;
      opacity: 0.7;
    }
    .ww-node-word {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--info);
    }
    .ww-node-alias {
      font-size: 11px;
      color: var(--muted);
      opacity: 0.7;
    }
    .ww-skip-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--wake);
      background: rgba(251,146,60,0.10);
      border: 1px solid rgba(251,146,60,0.35);
      border-radius: 999px;
      padding: 2px 8px 2px 6px;
      flex-shrink: 0;
      user-select: none;
    }
    .ww-skip-badge-icon {
      font-size: 11px;
      line-height: 1;
      opacity: 0.85;
    }
    .ww-global-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      border: 1px solid rgba(100,116,139,0.3);
      border-radius: 999px;
      padding: 1px 7px;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .ww-node-triggers {
      margin-left: 12px;
      margin-top: 2px;
      border-left: 1px solid var(--border);
      padding-left: 8px;
      margin-bottom: 4px;
    }

    /* global section separator */
    .ww-global-sep {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0 3px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
    }
    .ww-global-sep::before, .ww-global-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .center-col > #log-panel {
      flex: 1;
      min-height: 0;
    }
    .center-col > #log-panel.collapsed { flex: 0 0 auto; }
    #log-content {
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      max-height: 2000px;
      opacity: 1;
      overflow: hidden;
    }
    #log-panel.collapsed #log-content { max-height: 0; opacity: 0; }
    #log-toggle-icon {
      font-size: 10px;
      opacity: 0.5;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    #log-panel.collapsed #log-toggle-icon { transform: rotate(-90deg); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: var(--panel-shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--panel-accent), transparent);
      pointer-events: none;
    }

    .panel-hdr {
      padding: 9px 14px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.13em;
      color: var(--muted);
      background: var(--hdr-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .panel-hdr::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--info);
      box-shadow: 0 0 6px var(--info);
      flex-shrink: 0;
      opacity: 0.6;
    }
    .panel-hdr button {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      border-radius: 5px;
      transition: border-color 0.15s, color 0.15s;
      margin-left: auto;
    }
    .panel-hdr button:hover { border-color: var(--info); color: var(--text); }

    /* ── wake words panels ──────────────────────────────────────────────── */
    .aalias { color: var(--muted); font-size: 10px; margin-bottom: 4px; }
    .aalias-inline { color: var(--muted); font-size: 10px; font-weight: 400; }

    /* trigger row */
    .trig-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 7px;
      border-radius: 5px;
      background: rgba(255,255,255,0.025);
      box-shadow: inset 2px 0 0 rgba(255,255,255,0.06);
      transition: background 0.22s ease, box-shadow 0.22s ease;
      min-width: 0;
      width: 100%;
      cursor: default;
      margin-bottom: 2px;
    }
    .trig-row:hover {
      background: linear-gradient(90deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
      box-shadow: inset 2px 0 0 rgba(96,165,250,0.5);
    }
    [data-theme="light"] .trig-row {
      background: rgba(0,0,0,0.025);
      box-shadow: inset 2px 0 0 rgba(0,0,0,0.07);
    }
    [data-theme="light"] .trig-row:hover {
      background: linear-gradient(90deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.01) 100%);
      box-shadow: inset 2px 0 0 rgba(96,165,250,0.55);
    }
    .trig-phrase {
      font-size: 13px;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trig-phrase::before { content: '›'; margin-right: 5px; color: var(--muted); }
    .trig-reply-phrase {
      font-size: 12px;
      color: var(--reply-trig);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trig-else-phrase {
      font-size: 12px;
      color: var(--nomatch);
      flex: 1;
    }
    .trig-badges { display: flex; gap: 3px; flex-shrink: 0; }
    .abadge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .abadge-say      { background: rgba(96,165,250,0.13);  color: var(--info); }
    .abadge-shell    { background: rgba(250,204,21,0.13);  color: var(--amber); }
    .abadge-livekit  { background: rgba(74,222,128,0.13);  color: var(--match); }
    .abadge-telegram { background: rgba(96,165,250,0.10);  color: #7dd3fc; }
    .abadge-mqtt     { background: rgba(251,146,60,0.13);  color: var(--wake); }
    .abadge-ask      { background: rgba(167,139,250,0.13); color: var(--llm); }
    .abadge-tone     { background: rgba(100,116,139,0.13); color: var(--muted); }
    .abadge-log      { background: rgba(100,116,139,0.10); color: var(--muted); }
    .abadge-llm      { background: rgba(167,139,250,0.13); color: var(--llm); }
    .abadge-other    { background: rgba(100,116,139,0.10); color: var(--muted); }

    .trig-replies { border-left: 1px solid var(--border); margin-left: 10px; padding-left: 6px; margin-bottom: 2px; }

    .atrig { transition: opacity 0.2s; }

    /* wake-word trigger hit — green left-sweep */
    .atrig.trig-hit > .trig-row {
      border-radius: 5px;
      animation: trig-flash 1s ease-out forwards;
    }
    .atrig.trig-hit > .trig-row .trig-phrase { color: var(--match); }

    /* reply hit */
    .atrig.trig-reply-hit > .trig-row {
      border-radius: 5px;
      animation: trig-reply-flash 1s ease-out forwards;
    }
    .atrig.trig-reply-hit > .trig-row .trig-reply-phrase { color: var(--match); }

    .atrig.trig-dim { opacity: 0.15; }

    /* global trigger hit — amber left-sweep */
    .atrig-global.trig-hit > .trig-row {
      border-radius: 5px;
      animation: global-trig-flash 1s ease-out forwards;
    }
    .atrig-global.trig-hit > .trig-row .trig-phrase { color: var(--amber); }

    .ainteract {
      color: var(--info); font-size: 10px; font-weight: 600;
      padding: 1px 7px;
      background: rgba(96,165,250,0.08);
      border-radius: 4px;
      border: 1px solid rgba(96,165,250,0.18);
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .ainteract:empty { visibility: hidden; }

    /* AI fallback section */
    .llm-section {
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .llm-section-hdr {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--llm); margin-bottom: 5px;
      display: flex; align-items: center; gap: 5px;
    }
    .llm-model-tag {
      font-size: 10px; color: var(--muted);
      background: rgba(167,139,250,0.08);
      border: 1px solid var(--llm-border);
      border-radius: 4px; padding: 1px 6px; font-weight: 400;
    }
    .llm-attr { font-size: 11px; color: var(--muted); margin-left: 2px; }
    #llm-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--llm); flex-shrink: 0;
      transition: box-shadow 0.3s;
    }
    #llm-status-dot.thinking { box-shadow: 0 0 0 3px rgba(167,139,250,0.25); animation: llm-dot-pulse 1s ease-in-out infinite; opacity: 1; }

    /* ── log panel (center) ─────────────────────────────────────────────── */
    #le { flex: 1; overflow-y: auto; padding: 6px 12px; }
    .le {
      padding: 1px 0; white-space: pre-wrap; word-break: break-all;
      font-size: 10px; font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
    }
    .ts       { color: var(--muted); }
    .DEBUG    { color: var(--muted); }
    .INFO     { color: var(--info); }
    .WARNING  { color: var(--amber); }
    .ERROR    { color: var(--nomatch); }
    .CRITICAL { color: var(--nomatch); font-weight: bold; }

    /* ── history + participants panel (right) ───────────────────────────── */
    #right-panel { }
    #hist-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    #hl { overflow-y: auto; max-height: 380px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
    .he {
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      animation: slide-in 0.25s ease-out;
    }
    [data-theme="light"] .he { background: rgba(0,0,0,0.025); }
    .he-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .he-mid {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hts {
      font-size: 9px;
      color: var(--muted);
      opacity: 0.55;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .hwk {
      font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--wake);
      background: rgba(251,146,60,0.1);
      border: 1px solid rgba(251,146,60,0.22);
      border-radius: 3px;
      padding: 1px 6px;
    }
    .hwk-llm {
      font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--llm);
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.22);
      border-radius: 3px;
      padding: 1px 6px;
    }
    .hcmd {
      font-size: 12px;
      color: var(--text);
      line-height: 1.35;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .htrig {
      display: inline-flex; align-items: center; gap: 4px;
      flex-shrink: 0;
      font-size: 10px; font-weight: 600;
      color: var(--match);
      background: rgba(74,222,128,0.09);
      border: 1px solid rgba(74,222,128,0.18);
      border-radius: 4px;
      padding: 1px 7px;
    }
    .htrig::before { content: '→'; opacity: 0.6; margin-right: 2px; }
    .hllm-reply {
      font-size: 11px;
      color: var(--llm);
      opacity: 0.85;
      line-height: 1.35;
    }

    #part-section {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      max-height: 36%;
      display: flex;
      flex-direction: column;
    }
    #ph {
      padding: 7px 12px;
      color: var(--info); font-weight: 700; font-size: 10px;
      letter-spacing: 0.08em; flex-shrink: 0;
    }
    #pl { flex: 1; overflow-y: auto; padding: 4px 12px 8px; }
    .pt { padding: 2px 0; font-size: 12px; }
    .pdot  { color: var(--match); }
    .pdot0 { color: var(--muted); }

    /* ── room status panel ──────────────────────────────────────────────── */
    #room-status-panel {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }
    #room-status-panel .panel-hdr { border-bottom: none; padding-bottom: 0; }
    #room-status-body {
      padding: 8px 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rs-icon { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
    .rs-label { font-size: 13px; font-weight: 600; }
    .rs-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #room-status-panel.rs-waiting .rs-icon { animation: rs-pulse 1.2s ease-in-out infinite; }
    @keyframes rs-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ── right column ────────────────────────────────────────────────────── */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    .right-col > .panel {
      flex-shrink: 0;
    }

    /* ── monitoring panel ────────────────────────────────────────────────── */
    #monitoring-section {
      flex: 1;
      min-height: 0;
      transition: flex 0.3s ease;
    }
    #monitoring-section.collapsed {
      flex: 0 0 auto;
    }
    #mon-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      max-height: 600px;
      opacity: 1;
    }
    #monitoring-section.collapsed #mon-content {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }
    #mon-toggle-icon {
      margin-left: auto;
      font-size: 10px;
      opacity: 0.5;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    #monitoring-section.collapsed #mon-toggle-icon {
      transform: rotate(-90deg);
    }
    .panel-hdr.clickable { cursor: pointer; user-select: none; }
    .panel-hdr.clickable:hover #mon-toggle-icon,
    .panel-hdr.clickable:hover #hist-toggle-icon,
    .panel-hdr.clickable:hover #log-toggle-icon { opacity: 0.9; }

    /* ── history panel (right col, collapsible) ─────────────────────────── */
    #history-section { flex-shrink: 0; }
    #hist-content {
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      max-height: 400px;
      opacity: 1;
      overflow: hidden;
    }
    #history-section.collapsed #hist-content { max-height: 0; opacity: 0; }
    #hist-toggle-icon {
      font-size: 10px;
      opacity: 0.5;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    #history-section.collapsed #hist-toggle-icon { transform: rotate(-90deg); }
    #vu-bottom { margin-top: 10px; }

    /* ── CPU monitor ────────────────────────────────────────────────────── */
    #cpu-widget { display: flex; flex-direction: column; gap: 5px; }
    #cpu-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    #cpu-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    #cpu-cores-badge {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    #cpu-chart-wrap { position: relative; }
    #sparkline {
      display: block;
      width: 100%;
      height: 76px;
      border-radius: 6px;
    }
    #cpu-overlay {
      position: absolute;
      top: 6px;
      right: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      gap: 1px;
    }
    #cpu-load {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    #cpu-load-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      opacity: 0.7;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #cpu-secondary {
      display: flex;
      gap: 6px;
      margin-top: 3px;
    }
    .cpu-stat-chip {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 7px;
    }
    .cpu-stat-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .cpu-sec-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cpu-sec-val {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .cpu-stat-bar-track {
      height: 2px;
      border-radius: 1px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .cpu-stat-bar-fill {
      height: 100%;
      border-radius: 1px;
      transition: width 0.6s ease, background-color 0.4s ease;
    }
    @keyframes cpu-dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── toggles panel ──────────────────────────────────────────────────── */
    #toggles-panel { flex: 0 0 auto; }
    #toggles-body {
      padding: 8px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }
    #toggles-body button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 5px;
      line-height: 1.6;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    #toggles-body button:hover { border-color: var(--info); color: var(--info); transform: scale(1.1); }
    #toggles-body #btn-restart {
      font-size: 16px;
      padding: 4px 7px;
      line-height: 1.4;
      color: var(--pill-red);
      border-color: rgba(248,113,113,0.3);
    }
    #toggles-body #btn-restart:hover { border-color: var(--pill-red); color: #fca5a5; }
    #toggles-body #btn-restart:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #toggles-body #btn-restart.spinning { animation: spin 0.8s linear infinite; }
    #btn-restart svg { display: block; width: 16px; height: 16px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── AI panel ───────────────────────────────────────────────────────── */
    #ai-panel { flex-shrink: 0; }
    #ws-ind { font-size: 12px; color: var(--muted); font-weight: 600; }
    #ws-ind.ok { color: var(--match); }

    /* vertical VU meters */
    .vu-block {
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    .vu-row-v {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .vu-lbl-v {
      color: var(--fg);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      opacity: 0.75;
    }
    .vu-segs-v {
      position: relative;
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
      height: 160px;
      width: 40px;
    }
    .rms-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      border-radius: 1px;
      background: var(--nomatch);
      box-shadow: 0 0 5px var(--nomatch);
      pointer-events: none;
      transition: bottom 0.3s ease;
    }
    .seg-v {
      width: 100%;
      height: 7px;
      border-radius: 3px;
      background: rgba(128,128,128,0.14);
      transition: background-color 0.06s linear;
    }
    .seg-v.on:nth-child(-n+14)               { background: var(--match); }
    .seg-v.on:nth-child(n+15):nth-child(-n+17) { background: var(--amber); }
    .seg-v.on:nth-child(n+18)               { background: var(--nomatch); }
    .vu-db {
      color: var(--fg);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.85;
      min-width: 60px;
      text-align: center;
    }
    .vu-gain { color: var(--muted); font-size: 9px; opacity: 0.7; }

    /* ── room panel ──────────────────────────────────────────────────────── */
    #room-body {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #room-status-body {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #room-status-body.rs-active .rs-icon { animation: rs-pulse 1.2s ease-in-out infinite; }
    .rs-icon { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
    .rs-label { font-size: 12px; font-weight: 600; }
    .rs-sub   { font-size: 10px; color: var(--muted); }
    #room-participants-list { font-size: 10px; color: var(--muted); }

    /* ── donut timer ──────────────────────────────────────────────────── */
    #donut-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    #donut-wrap.visible { display: flex; }
    #donut-svg { width: 36px; height: 36px; transform: rotate(-90deg); }
    #donut-track { fill: none; stroke: var(--border); stroke-width: 3; }
    #donut-fill { fill: none; stroke: var(--info); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
    #donut-label { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 2em; text-align: center; }

    @keyframes rs-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ── STT waveform visualizer ────────────────────────────────────────── */
    .stt-wave {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 24px;
      flex-shrink: 0;
    }
    .sw {
      display: block;
      width: 3px;
      border-radius: 2px;
      height: 3px;
    }
    /* idle: flat line, very slow breath */
    .stt-wave.wv-idle .sw {
      background: rgba(148,163,184,0.45);
      animation: sw-idle var(--sw-speed, 1.8s) ease-in-out infinite alternate;
    }
    .stt-wave.wv-idle .sw:nth-child(1) { --sw-hi:  3px; animation-delay: 0.0s; }
    .stt-wave.wv-idle .sw:nth-child(2) { --sw-hi:  5px; animation-delay: 0.3s; }
    .stt-wave.wv-idle .sw:nth-child(3) { --sw-hi:  4px; animation-delay: 0.6s; }
    .stt-wave.wv-idle .sw:nth-child(4) { --sw-hi:  5px; animation-delay: 0.3s; }
    .stt-wave.wv-idle .sw:nth-child(5) { --sw-hi:  3px; animation-delay: 0.0s; }
    @keyframes sw-idle {
      from { height: 2px; opacity: 0.25; }
      to   { height: var(--sw-hi, 4px); opacity: 0.55; }
    }
    /* listen: medium energy, blue */
    .stt-wave.wv-listen .sw {
      background: var(--info);
      box-shadow: 0 0 5px rgba(96,165,250,0.35);
      animation: sw-listen var(--sw-speed, 0.55s) ease-in-out infinite alternate;
    }
    .stt-wave.wv-listen .sw:nth-child(1) { --sw-hi:  8px; animation-delay: 0.00s; }
    .stt-wave.wv-listen .sw:nth-child(2) { --sw-hi: 15px; animation-delay: 0.07s; }
    .stt-wave.wv-listen .sw:nth-child(3) { --sw-hi: 20px; animation-delay: 0.14s; }
    .stt-wave.wv-listen .sw:nth-child(4) { --sw-hi: 15px; animation-delay: 0.07s; }
    .stt-wave.wv-listen .sw:nth-child(5) { --sw-hi:  8px; animation-delay: 0.00s; }
    @keyframes sw-listen {
      from { height: 3px; opacity: 0.55; }
      to   { height: var(--sw-hi, 12px); opacity: 1; }
    }
    /* active: high energy, cyan, fast */
    .stt-wave.wv-active .sw {
      background: var(--transcribing);
      box-shadow: 0 0 7px rgba(99,202,183,0.5);
      animation: sw-active var(--sw-speed, 0.22s) ease-in-out infinite alternate;
    }
    .stt-wave.wv-active .sw:nth-child(1) { --sw-hi: 10px; animation-delay: 0.00s; }
    .stt-wave.wv-active .sw:nth-child(2) { --sw-hi: 18px; animation-delay: 0.04s; }
    .stt-wave.wv-active .sw:nth-child(3) { --sw-hi: 22px; animation-delay: 0.08s; }
    .stt-wave.wv-active .sw:nth-child(4) { --sw-hi: 18px; animation-delay: 0.04s; }
    .stt-wave.wv-active .sw:nth-child(5) { --sw-hi: 10px; animation-delay: 0.00s; }
    @keyframes sw-active {
      from { height: 5px; opacity: 0.7; }
      to   { height: var(--sw-hi, 14px); opacity: 1; }
    }

    /* ── animations ─────────────────────────────────────────────────────── */
    @keyframes glow-pulse {
      0%   { box-shadow: inset 2px 0 0 var(--wake), 0 0 0 0   rgba(251,146,60,0.5); }
      40%  { box-shadow: inset 2px 0 0 var(--wake), 0 0 0 8px rgba(251,146,60,0.15); }
      100% { box-shadow: inset 2px 0 0 var(--wake), 0 0 0 0   rgba(251,146,60,0); }
    }
    @keyframes flash-green {
      0%   { background: var(--surface); border-color: var(--border); }
      20%  { background: rgba(74,222,128,0.12); border-color: var(--match); }
      100% { background: var(--surface); border-color: var(--border); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    @keyframes slide-in {
      from { transform: translateY(-10px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    @keyframes trig-flash {
      0%   { background: rgba(74,222,128,0.40);
             box-shadow: inset 3px 0 0 var(--match), 0 0 10px rgba(74,222,128,0.25); }
      40%  { box-shadow: inset 3px 0 0 var(--match), 0 0 4px rgba(74,222,128,0.10); }
      100% { background: rgba(74,222,128,0.07);
             box-shadow: inset 3px 0 0 rgba(74,222,128,0.35); }
    }
    @keyframes trig-reply-flash {
      0%   { background: rgba(74,222,128,0.35);
             box-shadow: inset 3px 0 0 var(--match), 0 0 8px rgba(74,222,128,0.2); }
      40%  { box-shadow: inset 3px 0 0 var(--match); }
      100% { background: rgba(74,222,128,0.06);
             box-shadow: inset 3px 0 0 rgba(74,222,128,0.3); }
    }
    @keyframes global-trig-flash {
      0%   { background: rgba(250,204,21,0.38);
             box-shadow: inset 3px 0 0 var(--amber), 0 0 12px rgba(250,204,21,0.3); }
      40%  { box-shadow: inset 3px 0 0 var(--amber), 0 0 4px rgba(250,204,21,0.10); }
      100% { background: rgba(250,204,21,0.07);
             box-shadow: inset 3px 0 0 rgba(250,204,21,0.4); }
    }

    /* LLM specific */
    @keyframes llm-dot-pulse {
      0%, 100% { opacity: 0.15; transform: scale(0.75); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes morph-out {
      0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }
    @keyframes morph-in {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    #morph-overlay {
      display: none;
      position: fixed; top: 50%; left: 50%;
      z-index: 9999;
      width: 100px; height: 100px;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    #morph-overlay.active { display: block; }
    .morph-icon {
      position: absolute; top: 50%; left: 50%;
      width: 60px; height: 60px;
      margin-left: -30px; margin-top: -30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      background: var(--surface);
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .morph-out { animation: morph-out 0.45s ease-in forwards; }
    .morph-in  { animation: morph-in 0.45s ease-out forwards; }
    @keyframes llm-think-glow {
      0%, 100% { box-shadow: 0 0 0 0   rgba(167,139,250,0.35), inset 0 0 0 0 rgba(167,139,250,0); }
      50%      { box-shadow: 0 0 12px 2px rgba(167,139,250,0.15), inset 0 0 20px 0 rgba(167,139,250,0.04); }
    }
    @keyframes llm-reply-flash {
      0%   { background: rgba(167,139,250,0.18); border-color: var(--llm); }
      100% { background: var(--surface);         border-color: var(--border); }
    }

    #hero.anim-match    { animation: flash-green 0.7s ease-out forwards; }
    #hero.anim-nomatch  { animation: shake 0.5s ease-out; }
    #hero.llm-thinking  { animation: llm-think-glow 1.6s ease-in-out infinite; border-color: var(--llm-border); }
    #hero.anim-llm-reply { animation: llm-reply-flash 1.2s ease-out forwards; }

    /* ── log panel — dev only ──────────────────────────────────────────────── */
    body.dev-mode #log-panel { display: flex; }
    #log-panel { display: none; }
    body:not(.dev-mode) .center-col { justify-content: center; }

    /* ── glow and grow animations ─────────────────────────────────────────── */
    .ww-card {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 4px 2px;
      transition: background 0.25s, box-shadow 0.25s;
    }
    .ww-card.ww-active {
      background: rgba(251,146,60,0.06);
      box-shadow: inset 2px 0 0 var(--wake);
      animation: glow-pulse 1.2s ease-out;
    }
    @keyframes glow-pulse {
      0%   { box-shadow: inset 2px 0 0 var(--wake), 0 0 0 0   rgba(251,146,60,0.5); }
      40%  { box-shadow: inset 2px 0 0 var(--wake), 0 0 0 8px rgba(251,146,60,0.15); }
      100% { box-shadow: inset 2px 0 0 var(--wake), 0 0 0 0   rgba(251,146,60,0); }
    }

    /* ── scrollbars ─────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }

    #hl, #le { scrollbar-width: thin; }

    /* ── responsive: narrow screens ───────────────────────────────────────── */
    @media (max-width: 800px) {
      #main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }
      #monitoring-section { display: none; }
      #history-section { display: none; }
    }
  </style>
</head>
<body>

    <div id="status-bar">
      <div class="sdot" id="cdot"></div>
      <span id="ws-ind">WS connecting…</span>

    </div>

  <div id="main">

    <div class="center-col">
      <div id="hero">
        <span class="hero-inner">
          <span class="stt-wave wv-idle"><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span></span>
          <span class="hero-text hero-muted">STT inactive</span>
        </span>
      </div>

      <div class="panel" id="ww-tree-panel">
        <div class="panel-hdr">TRIGGERS</div>
        <div id="ww-tree-content"></div>
      </div>

      <div class="panel" id="log-panel">
        <div class="panel-hdr clickable" onclick="toggleLog()">LOGS <span style="margin-right:auto"></span><button onclick="event.stopPropagation();clearLogs()">clear</button><span id="log-toggle-icon">▾</span></div>
        <div id="log-content">
          <div id="le"></div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel" id="toggles-panel">
        <div id="toggles-body">
          <button id="btn-mode" aria-label="Toggle mode" onclick="toggleMode()">&lt;/&gt;</button>
          <button id="btn-theme" aria-label="Toggle theme" onclick="toggleTheme()">☀</button>
          <button id="btn-restart" aria-label="Restart" onclick="sendCtrl('restart')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
        </div>
      </div>
      <div id="morph-overlay"></div>

      <div class="panel" id="room-panel">
        <div class="panel-hdr">ROOM<span id="room"></span></div>
        <div id="room-body">
          <div id="room-status-body">
            <span class="rs-icon" id="rs-icon">📵</span>
            <div>
              <div class="rs-label" id="rs-label">Closed</div>
              <div class="rs-sub" id="rs-sub">No active call</div>
              <div id="room-participants-list" style="display:none;margin-top:4px;font-size:11px"></div>
            </div>
            <div id="donut-wrap">
              <svg id="donut-svg" viewBox="0 0 36 36">
                <circle id="donut-track" cx="18" cy="18" r="15"/>
                <circle id="donut-fill" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="0"/>

              <span id="cpu-cores-badge"></span>

            <div id="cpu-chart-wrap">
              <svg id="sparkline" viewBox="0 0 200 76" preserveAspectRatio="none"></svg>
              <div id="cpu-overlay">
                <span id="cpu-load">0.00</span>

            <div id="cpu-secondary">
              <div class="cpu-stat-chip">
                <div class="cpu-stat-top">
                  <span class="cpu-sec-lbl">5m</span>
                  <span class="cpu-sec-val" id="cpu-load5">—</span>
                </div>
                <div class="cpu-stat-bar-track"><div class="cpu-stat-bar-fill" id="cpu-bar5"></div></div>
              </div>
              <div class="cpu-stat-chip">
                <div class="cpu-stat-top">
                  <span class="cpu-sec-lbl">15m</span>
                  <span class="cpu-sec-val" id="cpu-load15">—</span>
                </div>
                <div class="cpu-stat-bar-track"><div class="cpu-stat-bar-fill" id="cpu-bar15"></div></div>
              </div>
              <div class="cpu-stat-chip">
                <div class="cpu-stat-top">
                  <span class="cpu-sec-lbl">RAM</span>
                  <span class="cpu-sec-val" id="ram-free-pct">—</span>
                </div>
                <div class="cpu-stat-bar-track"><div class="cpu-stat-bar-fill" id="ram-free-bar"></div></div>

          </div>
          <div id="vu-bottom">
            <div class="vu-block">
              <div class="vu-row-v">
                <span class="vu-lbl-v">MIC</span>
                <div class="vu-segs-v" id="mic-segs-v"><div class="rms-line" id="mic-rms-line"></div></div>
                <span class="vu-db" id="mic-db">-∞ dB</span>
                <span class="vu-gain" id="mic-gain"></span>
              </div>
              <div class="vu-row-v">
                <span class="vu-lbl-v">SPK</span>
                <div class="vu-segs-v" id="spk-segs-v"></div>

      <div class="panel" id="history-section">
        <div class="panel-hdr clickable" onclick="toggleHistory()">HISTORY <span style="margin-right:auto"></span><button onclick="event.stopPropagation();clearHistory()">clear</button><span id="hist-toggle-icon">▾</span></div>
        <div id="hist-content">
          <div id="hl"></div>
        </div>
      </div>

      <div class="panel" id="ai-panel">
        <div id="ai-section" style="display:none">
          <div class="panel-hdr">AI FALLBACK<span id="llm-model-name"></span></div>
          <div id="ai-content" style="padding:8px 12px;font-size:12px"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // build vertical segmented VU meters
    ['mic-segs-v', 'spk-segs-v'].forEach(id => {
      const c = document.getElementById(id);
      for (let i = 0; i < 20; i++) {
        const s = document.createElement('span');
        s.className = 'seg-v';
        c.appendChild(s);
      }
    });

    let ws = null, reconnTimer = null, _restarting = false, _reconnDelay = 1000;
    let _lastWakeWord = '', _cfg = null;
    const parts = {};
    const _heroTimers = {};

    function connect() {
      clearTimeout(reconnTimer);
      if (ws) { ws.onclose = ws.onerror = null; try { ws.close(); } catch(e) {} }
      ws = new WebSocket('ws://' + location.host + '/ws');
      ws.onopen = () => {
        _reconnDelay = 1000;
        wsInd(true);
        if (_restarting) {
          setSt('Restarting UI…', null);
          setTimeout(() => location.reload(), 200);
        }
      };
      ws.onclose = () => {
        wsInd(false); ws = null;
        if (_restarting) setSt('Waiting for server…', null);
        reconnTimer = setTimeout(connect, _reconnDelay);
        _reconnDelay = Math.min(_reconnDelay * 2, 8000);
      };
      ws.onerror = () => {
        clearTimeout(reconnTimer);
        reconnTimer = setTimeout(connect, _reconnDelay);
        _reconnDelay = Math.min(_reconnDelay * 2, 8000);
      };
      ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch(_) {} };
    }

    function wsInd(up) {
      const el = document.getElementById('ws-ind');
      el.textContent = up ? 'WS connected' : 'WS reconnecting…';
      el.className   = up ? 'ok' : '';
      const dot = document.getElementById('cdot');
      dot.className = up ? 'sdot ok' : 'sdot warn';
    }

    function handle(m) {
      switch (m.type) {
        case 'hello': {
          _restarting = false;
          const rb = document.getElementById('btn-restart');
          rb.disabled = false; rb.textContent = 'Restart';
          setSt(m.status, m.room);
          (m.participants || []).forEach(p => parts[p.identity] = p.tracks);
          renderParts();
          setAudio(m.audio_connected, m.audio_conn_type);
          setStt(m.stt_state, m.stt_text, m);
          setStatusListening(m.stt_state === 'wake' || m.stt_state === 'partial' || m.stt_state === 'transcribing');
          if (m.actions_config) { _cfg = m.actions_config; renderActions(_cfg); }
          setRoomStatus(m.room_status || 'closed', m.room_answer_timeout || 0);
          if (m.input_gain != null) {
            const el = document.getElementById('mic-gain');
            if (el) el.textContent = '×' + m.input_gain.toFixed(1);
          }
          if (m.cpu_limit != null) _cpuLimit = m.cpu_limit;
          break;
        }
        case 'starting':           setSt('Starting…', null); break;
        case 'idle':               setSt('Ready', null); break;
        case 'connecting':         setSt('Connecting…', null); break;
        case 'connected':          setSt('Connected', m.room); setRoomStatus('in_call', 0); break;
        case 'disconnected':       setSt('Disconnected — reconnecting…', null); setRoomStatus('closed', 0); break;
        case 'reconnecting':       setSt('Reconnecting…', null); break;
        case 'empty_room_timeout': setSt('Disconnected — empty room', null); break;
        case 'participant_joined':
          parts[m.identity] = parts[m.identity] || 0; renderParts(); break;
        case 'participant_left':
          delete parts[m.identity]; renderParts(); break;
        case 'track_subscribed':
          parts[m.identity] = (parts[m.identity] || 0) + 1; renderParts(); break;
        case 'track_unsubscribed':
          if (m.identity in parts) parts[m.identity] = Math.max(0, (parts[m.identity]||1)-1);
          renderParts(); break;
        case 'volume_update': {
          setVU('mic', m.mic||0); setVU('spk', m.spk||0);
          const wave = document.querySelector('#hero .stt-wave');
          if (wave && m.mic > 0) {
            const hasActive = wave.classList.contains('wv-active');
            const hasListen = wave.classList.contains('wv-listen');
            if (hasActive) {
              const speed = Math.max(0.12, 0.25 - m.mic * 0.18);
              wave.style.setProperty('--sw-speed', speed.toFixed(2) + 's');
            } else if (hasListen) {
              const speed = Math.max(0.3, 0.55 - m.mic * 0.3);
              wave.style.setProperty('--sw-speed', speed.toFixed(2) + 's');
            }
          }
          const hero = document.getElementById('hero');
          if (hero && hero.classList.contains('wave-glow')) {
            hero.style.setProperty('--glow-power', Math.min(1, (m.mic || 0) * 3).toFixed(2));
          }
          break;
        }
        case 'audio_status':  setAudio(m.connected, m.conn_type); break;
        case 'stt': {
          const s = m.state;
          setStatusListening(s === 'wake' || s === 'partial' || s === 'transcribing');
          if (s === 'wake' && m.word && m.word !== '(reply)') {
            _lastWakeWord = m.word;
            updateInteraction(m.word, '');
          }
          if (s === 'partial') {
            updateInteraction(_lastWakeWord, m.text);
            if (!_lastWakeWord) dimNonMatchingReplies(m.text || '');
          }
          if (s === 'matched') {
            const isReply = !_lastWakeWord;
            addHistory(_lastWakeWord, m.transcript||'', m.trigger||'');
            updateInteraction(_lastWakeWord, (m.transcript||'') + ' → ' + (m.trigger||''), true);
            highlightTrigger(m.trigger||'', isReply);
            clearReplyDim();
            _lastWakeWord = '';
          }
          if (s === 'nomatch') {
            clearReplyDim();
            if (_lastWakeWord) {
              addHistoryWake(_lastWakeWord);
              updateInteraction(_lastWakeWord, (m.text ? '"'+m.text+'" ' : '') + '✗ no match', true);
              _lastWakeWord = '';
            }
          }
          if (s === 'skipped') {
            clearReplyDim();
            updateInteraction(m.word||'', (m.text ? '"'+m.text+'" ' : '') + '⊘ ignored', true);
            _lastWakeWord = '';
          }
          if (s === 'llm_thinking') {
            setLlmBadgeThinking(true);
            setLlmStatusDot(true);
          }
          if (s === 'llm_reply') {
            setLlmBadgeThinking(false);
            setLlmStatusDot(false);
            addHistoryLLM(m.transcript||'', m.reply||'');
          }
          if (s === 'llm_unreachable') {
            setLlmBadgeThinking(false);
            setLlmStatusDot(false);
          }
          setStt(s, m.text||m.word||m.transcript||m.reply||'', m);
          break;
        }
        case 'log':       addLog(m); break;
        case 'restarting': {
          _restarting = true;
          const b = document.getElementById('btn-restart');
          b.disabled = true; b.classList.add('spinning');
          setSt('Restarting…', null);
          break;
        }
        case 'room_status': setRoomStatus(m.status, m.timeout||0); break;
        case 'system_stats': updateSparkline(m); break;
        case 'error': setSt('Error: ' + (m.msg||'unknown'), null); break;
        case 'reload': location.reload(); break;
      }
    }

    const _RS = {
      closed:  { icon: '📵', label: 'Closed',   sub: 'No active call',        cls: '' },
      waiting: { icon: '📞', label: 'Waiting…', sub: 'Polling for caller',     cls: 'rs-waiting' },
      in_call: { icon: '🟢', label: 'In Call',  sub: 'Call active',            cls: '' },
    };
    let _donutStart = 0, _donutTotal = 0, _donutTimer = null;
    const _donutCirc = 2 * Math.PI * 15;
    function _updateDonut() {
      if (!_donutTotal) return;
      const elapsed = (Date.now() - _donutStart) / 1000;
      const remaining = Math.max(0, _donutTotal - elapsed);
      const pct = remaining / _donutTotal;
      const fill = document.getElementById('donut-fill');
      const label = document.getElementById('donut-label');
      if (fill) fill.setAttribute('stroke-dashoffset', (_donutCirc * (1 - pct)).toFixed(1));
      if (label) label.textContent = Math.ceil(remaining) + 's';
      if (remaining <= 0) { clearInterval(_donutTimer); _donutTimer = null; }
    }
    function _showDonut(timeout) {
      _donutStart = Date.now();
      _donutTotal = timeout;
      const wrap = document.getElementById('donut-wrap');
      if (wrap) wrap.classList.add('visible');
      _updateDonut();
      if (_donutTimer) clearInterval(_donutTimer);
      _donutTimer = setInterval(_updateDonut, 200);
    }
    function _hideDonut() {
      if (_donutTimer) { clearInterval(_donutTimer); _donutTimer = null; }
      _donutTotal = 0;
      const wrap = document.getElementById('donut-wrap');
      if (wrap) wrap.classList.remove('visible');
    }
    function setRoomStatus(status, timeout) {
      const cfg = _RS[status] || _RS.closed;
      const body = document.getElementById('room-status-body');
      body.className = status === 'in_call' ? 'rs-active' : '';
      document.getElementById('rs-icon').textContent  = cfg.icon;
      document.getElementById('rs-label').textContent = cfg.label;
      let sub = cfg.sub;
      if (status === 'waiting' && timeout > 0) sub += ' (' + timeout + 's)';
      document.getElementById('rs-sub').textContent = sub;
      const pList = document.getElementById('room-participants-list');
      if (status === 'in_call') {
        const names = Object.keys(parts);
        pList.textContent = names.length ? '● ' + names.join(', ') : '';
        pList.style.display = names.length ? 'block' : 'none';
      } else {
        pList.style.display = 'none';
      }
      if (status === 'waiting' && timeout > 0) {
        _showDonut(timeout);
      } else {
        _hideDonut();
      }
    }

    function setLlmBadgeThinking(on) {
      const el = document.getElementById('llm-model-name');
      if (el) el.classList.toggle('thinking', on);
    }

    function setLlmStatusDot(thinking) {
      const dot = document.getElementById('llm-status-dot');
      if (!dot) return;
      dot.classList.toggle('thinking', thinking);
    }

    function heroAnim(cls, duration) {
      const h = document.getElementById('hero');
      clearTimeout(_heroTimers[cls]);
      h.classList.remove(cls);
      void h.offsetWidth;
      h.classList.add(cls);
      _heroTimers[cls] = setTimeout(() => h.classList.remove(cls), duration);
    }

    const _trigTimers = {};
    function _trigPhrase(el) {
      const p = el.querySelector('.trig-phrase, .trig-reply-phrase, .trig-else-phrase');
      return p ? p.textContent.replace(/\(.*?\)/g, '').trim().toLowerCase() : '';
    }

    function highlightTrigger(phrase, isReply) {
      if (!phrase) return;
      const norm = phrase.toLowerCase().trim();
      document.querySelectorAll('.atrig').forEach(el => {
        if (_trigPhrase(el) === norm) {
          const cls = isReply ? 'trig-reply-hit' : 'trig-hit';
          clearTimeout(_trigTimers[norm]);
          el.classList.remove('trig-hit', 'trig-reply-hit');
          void el.offsetWidth;
          el.classList.add(cls);
          _trigTimers[norm] = setTimeout(() => el.classList.remove(cls), 4000);
        }
      });
    }

    function dimNonMatchingReplies(partial) {
      const norm = partial.toLowerCase().trim();
      document.querySelectorAll('.atrig').forEach(el => {
        const isReply = !!el.querySelector('.trig-reply-phrase, .trig-else-phrase');
        if (!isReply) return;
        const p = _trigPhrase(el);
        if (norm && !p.includes(norm) && !norm.includes(p)) {
          el.classList.add('trig-dim');
        } else {
          el.classList.remove('trig-dim');
        }
      });
    }

    function clearReplyDim() {
      document.querySelectorAll('.atrig.trig-dim').forEach(el => el.classList.remove('trig-dim'));
    }

    function updateInteraction(word, text, finish) {
      if (!word) return;
      const norm = word.toLowerCase().trim();
      document.querySelectorAll('.ww-card').forEach(g => {
        const ww = g.getAttribute('data-word').toLowerCase();
        const aa = (g.getAttribute('data-aliases')||'').toLowerCase().split(',');
        if (ww === norm || aa.includes(norm)) {
          g.classList.add('ww-active');
          const i = g.querySelector('.ainteract');
          if (i) {
            i.textContent = text;
            if (finish) setTimeout(() => {
              if (_lastWakeWord === '') { g.classList.remove('ww-active'); i.textContent = ''; }
            }, 3000);
          }
        } else {
          g.classList.remove('ww-active');
          const i = g.querySelector('.ainteract');
          if (i) i.textContent = '';
        }
      });
    }

    function setSt(_text, room) {
      if (room !== null)
        document.getElementById('room').textContent = room || '';
    }

    function setStatusListening(listening) {
      const hero = document.getElementById('hero');
      if (listening) {
        hero.classList.add('wave-glow');
      } else {
        hero.classList.remove('wave-glow');
        hero.style.removeProperty('--glow-power');
      }
    }

    function renderParts() {
      const keys = Object.keys(parts);
      const pList = document.getElementById('room-participants-list');
      if (!pList) return;
      if (keys.length) {
        pList.textContent = '● ' + keys.join(', ');
        pList.style.display = 'block';
      } else {
        pList.textContent = '';
        pList.style.display = 'none';
      }
    }

    function _aliases(list) {
      return (list && list.length) ? ' <span class="aalias-inline">(' + esc(list.join(', ')) + ')</span>' : '';
    }

    function _actionBadge(label) {
      if (!label) return '';
      const l = label.toLowerCase();
      if (l.startsWith('say:'))          return '<span class="abadge abadge-say">say</span>';
      if (l.startsWith('shell:'))        return '<span class="abadge abadge-shell">shell</span>';
      if (l.startsWith('livekit'))       return '<span class="abadge abadge-livekit">livekit</span>';
      if (l.startsWith('telegram'))      return '<span class="abadge abadge-telegram">tg</span>';
      if (l.startsWith('mqtt:'))         return '<span class="abadge abadge-mqtt">mqtt</span>';
      if (l.startsWith('ask:'))          return '<span class="abadge abadge-ask">ask</span>';
      if (l.startsWith('tone'))          return '<span class="abadge abadge-tone">tone</span>';
      if (l.startsWith('log:'))          return '<span class="abadge abadge-log">log</span>';
      if (l.startsWith('llm'))           return '<span class="abadge abadge-llm">llm</span>';
      const short = label.length > 9 ? label.slice(0, 9) + '…' : label;
      return '<span class="abadge abadge-other">' + esc(short) + '</span>';
    }

    function _badges(actions) {
      return (actions || []).map(a => _actionBadge(a.label)).join('');
    }

    function renderTrigTree(actions) {
      let res = '';
      (actions || []).forEach(a => {
        if (a.type === 'ask' && (a.on_reply || a.on_else)) {
          res += '<div class="trig-replies">';
          (a.on_reply || []).forEach(r => {
            res += '<div class="atrig"><div class="trig-row">'
              + '<span class="trig-reply-phrase">⮑ ' + esc(r.phrase) + '</span>'
              + '<span class="trig-badges">' + _badges(r.actions) + '</span>'
              + '</div>' + renderTrigTree(r.actions) + '</div>';
          });
          if (a.on_else && a.on_else.length) {
            res += '<div class="atrig"><div class="trig-row">'
              + '<span class="trig-else-phrase">⮑ else</span>'
              + '<span class="trig-badges">' + _badges(a.on_else) + '</span>'
              + '</div></div>';
          }
          res += '</div>';
        }
      });
      return res;
    }

    function renderActions(cfg) {
      if (!cfg) return;

      function trigRows(triggers, global) {
        const extra = global ? ' atrig-global' : '';
        return (triggers || []).map(t =>
          '<div class="atrig' + extra + '"><div class="trig-row">'
          + '<span class="trig-phrase">' + esc(t.phrase) + _aliases(t.aliases) + '</span>'
          + '<span class="trig-badges">' + _badges(t.actions) + '</span>'
          + '</div>' + renderTrigTree(t.actions) + '</div>'
        ).join('');
      }

      const tree = document.getElementById('ww-tree-content');
      if (tree) {
        let h = '';

        function wwCard(w) {
          const aliases = (w.aliases || []).join(', ');
          const hasTriggers = w.triggers && w.triggers.length;
          const hasGlobals = cfg.global_triggers && cfg.global_triggers.length;
          return '<div class="ww-group">'
            + '<div class="ww-card" data-word="' + esc(w.word) + '" data-aliases="' + esc((w.aliases||[]).join(',')) + '">'
            + '<div class="ww-node-hdr">'
            + '<div class="ww-node-hdr-left">'
            + '<span class="ww-node-dot"></span>'
            + '<span class="ww-node-word">' + esc(w.word) + '</span>'
            + (aliases ? '<span class="ww-node-alias">· ' + esc(aliases) + '</span>' : '')
            + (w.skip_unmatched_inline ? '<span class="ww-skip-badge" title="skip_unmatched_inline: unrecognised inline commands are silently ignored"><span class="ww-skip-badge-icon">⊘</span>strict</span>' : '')
            + (!hasTriggers && hasGlobals ? '<span class="ww-global-badge" title="uses global triggers">↓ global</span>' : '')
            + '</div>'
            + '<div class="ainteract"></div>'
            + '</div>'
            + (hasTriggers
                ? '<div class="ww-node-triggers">' + trigRows(w.triggers) + '</div>'
                : '')
            + '</div>'
            + '</div>';
        }

        (cfg.wake_words || []).forEach(w => { h += wwCard(w); });

        if (cfg.global_triggers && cfg.global_triggers.length) {
          h += '<div class="ww-global-sep">global triggers</div>';
          h += '<div class="ww-node-triggers" style="margin-left:0;border-left:none;padding-left:2px">'
            + trigRows(cfg.global_triggers, true)
            + '</div>';
        }

        tree.innerHTML = h;
      }

      // LLM section — render in monitoring column
      if (cfg.llm) {
        const llm = cfg.llm;
        const aiSection = document.getElementById('ai-section');
        const aiContent = document.getElementById('ai-content');
        if (aiSection && aiContent) {
          aiSection.style.display = 'block';
          aiContent.innerHTML = '<div><span id="llm-status-dot"></span> <span class="llm-model-tag">' + esc(llm.model) + '</span></div>'
            + '<div class="llm-attr">@ ' + esc(llm.host) + '</div>'
            + (llm.fallback ? '<div class="llm-attr" style="color:var(--llm);opacity:0.7">⮑ on no match</div>' : '');
        }

        const modelEl = document.getElementById('llm-model-name');
        if (modelEl) modelEl.textContent = llm.model.split('/').pop();
      }
    }

    const _micRmsBuf = [];
    const _RMS_WIN = 40;

    function setVU(ch, lvl) {
      const count = Math.round(Math.sqrt(Math.max(0, Math.min(1, lvl))) * 20);
      const dv    = lvl > 1e-9 ? (20 * Math.log10(Math.max(lvl, 1e-9))).toFixed(1) : null;
      const segs  = document.getElementById(ch + '-segs-v').children;
      for (let i = 0; i < segs.length; i++) {
        const el = segs[i];
        if (el.classList.contains('rms-line')) continue;
        el.classList.toggle('on', i < count);
      }
      document.getElementById(ch + '-db').textContent = dv ? dv + ' dB' : '-∞ dB';

      if (ch === 'mic') {
        _micRmsBuf.push(lvl);
        if (_micRmsBuf.length > _RMS_WIN) _micRmsBuf.shift();
        const rms = _micRmsBuf.reduce((s, v) => s + v, 0) / _micRmsBuf.length;
        const rmsCount = Math.sqrt(Math.max(0, Math.min(1, rms))) * 20;
        const rmsLine = document.getElementById('mic-rms-line');
        if (rmsLine) rmsLine.style.bottom = (rmsCount / 20 * 100).toFixed(1) + '%';
      }
    }

    function setAudio(connected, connType) {
      // no-op: device labels removed in the panel restructure
    }

    let _lastWake = '';
    let _partialClearTimer = null;

    function _armPartialClear() {
      clearTimeout(_partialClearTimer);
      _partialClearTimer = setTimeout(() => {
        const wave = document.querySelector('#hero .stt-wave');
        if (wave && wave.classList.contains('wv-active')) {
          _lastWake = '';
          setStatusListening(false);
          _setHeroContent(_sttWave('wv-idle')
            + '<span class="hero-text hero-muted">…</span>');
        }
      }, 2500);
    }

    function _cancelPartialClear() {
      clearTimeout(_partialClearTimer);
      _partialClearTimer = null;
    }

    function _wakeChip(word, muted) {
      const style = muted ? ' style="opacity:0.45;border-color:var(--skipped);color:var(--skipped)"' : '';
      return '<span class="wake-chip"' + style + '><span class="wake-chip-icon">◉</span>' + esc(word) + '</span>';
    }

    let _heroFadeTimer = null;
    function _setHeroContent(html) {
      const inner = document.querySelector('#hero .hero-inner');
      if (!inner) { document.getElementById('hero').innerHTML = '<span class="hero-inner">' + html + '</span>'; return; }
      clearTimeout(_heroFadeTimer);
      inner.classList.remove('enter');
      inner.classList.add('exit');
      _heroFadeTimer = setTimeout(() => {
        inner.innerHTML = html;
        inner.classList.remove('exit');
        void inner.offsetWidth;
        inner.classList.add('enter');
        _heroFadeTimer = setTimeout(() => inner.classList.remove('enter'), 250);
      }, 160);
    }

    // Update the hero bar in-place with no animation delay — used for
    // partial/transcribing updates so words appear word-by-word in real time.
    function _updateHeroText(waveClass, textHtml) {
      clearTimeout(_heroFadeTimer);
      const hero = document.getElementById('hero');
      let inner = hero.querySelector('.hero-inner');
      if (!inner) {
        hero.innerHTML = '<span class="hero-inner"></span>';
        inner = hero.querySelector('.hero-inner');
      }
      inner.classList.remove('exit', 'enter');
      let wave = inner.querySelector('.stt-wave');
      if (!wave) {
        inner.innerHTML = '<span class="stt-wave ' + waveClass + '">' + _SW + '</span>'
          + '<span class="hero-text"></span>';
        wave = inner.querySelector('.stt-wave');
      } else if (!wave.classList.contains(waveClass)) {
        wave.className = 'stt-wave ' + waveClass;
      }
      const txt = inner.querySelector('.hero-text');
      if (txt) txt.innerHTML = textHtml;
    }

    const _SW = '<span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span>';
    function _sttWave(cls) { return '<span class="stt-wave ' + cls + '">' + _SW + '</span>'; }

    function setStt(state, text, m) {
      const h = document.getElementById('hero');
      h.classList.remove('llm-thinking');
      switch (state) {
        case 'listening':
          _cancelPartialClear();
          _lastWake = '';
          _setHeroContent(_sttWave('wv-idle')
            + '<span class="hero-text hero-muted"><em>' + (text || 'waiting…') + '</em></span>');
          break;
        case 'transcribing':
          _updateHeroText('wv-active',
            '<span style="color:var(--transcribing)">' + esc(text) + '</span>'
            + '<span class="hero-muted"> …</span>');
          _armPartialClear();
          break;
        case 'wake':
          _cancelPartialClear();
          _lastWake = text;
          _setHeroContent(_sttWave('wv-listen')
            + '<span class="hero-text">'
            + _wakeChip(text)
            + '<span class="hero-muted">listening…</span>'
            + '</span>');
          break;
        case 'partial':
          _updateHeroText('wv-active',
            (_lastWake ? _wakeChip(_lastWake) : '')
            + '<span class="hero-s2">' + esc(text) + '</span>'
            + '<span class="cursor">▋</span>');
          _armPartialClear();
          break;
        case 'matched': {
          _cancelPartialClear();
          const transcript = m.transcript || text;
          _setHeroContent('<span class="hero-icon" style="color:var(--match)">✓</span>'
            + '<span class="hero-text">'
            + (_lastWake ? _wakeChip(_lastWake) : '')
            + (transcript ? '<span style="color:var(--match)">' + esc(transcript) + '</span>' : '')
            + (m.trigger ? '<span class="hero-muted">→</span><span class="hero-trigger">' + esc(m.trigger) + '</span>' : '')
            + '</span>');
          heroAnim('anim-match', 700);
          break;
        }
        case 'nomatch':
          _cancelPartialClear();
          _setHeroContent('<span class="hero-icon" style="color:var(--nomatch)">✗</span>'
            + '<span class="hero-text">'
            + (_lastWake ? _wakeChip(_lastWake) : '')
            + (text ? '<span style="color:var(--nomatch)">' + esc(text) + '</span>' : '')
            + '<span style="color:var(--nomatch);margin-left:4px">no match</span>'
            + '</span>');
          heroAnim('anim-nomatch', 500);
          break;
        case 'skipped':
          _cancelPartialClear();
          _setHeroContent('<span class="hero-icon" style="color:var(--skipped)">⊘</span>'
            + '<span class="hero-text">'
            + (m.word ? _wakeChip(m.word, true) : '')
            + (text ? '<span style="color:var(--skipped)">' + esc(text) + '</span>' : '')
            + '<span style="color:var(--skipped);margin-left:4px">ignored</span>'
            + '</span>');
          _lastWake = '';
          break;
        case 'gated':
          _cancelPartialClear();
          _setHeroContent('<span class="hero-icon hero-muted">⏸</span>'
            + '<span class="hero-text hero-muted">STT paused during call</span>');
          break;
        case 'llm_thinking': {
          _cancelPartialClear();
          h.classList.add('llm-thinking');
          const transcript = m.transcript || text;
          _setHeroContent('<span class="llm-orb"><span class="hero-icon" style="color:var(--llm)">◈</span>'
            + '<span class="llm-orb-ring"></span></span>'
            + '<span class="hero-text">'
            + (transcript ? '<span style="color:var(--transcribing);font-style:italic">"' + esc(transcript) + '"</span>' : '')
            + '<span class="hero-think-dots">'
            + '<span class="td"></span><span class="td"></span><span class="td"></span>'
            + '</span></span>');
          break;
        }
        case 'llm_reply': {
          heroAnim('anim-llm-reply', 1200);
          const reply = m.reply || text;
          _setHeroContent('<span class="hero-icon" style="color:var(--llm)">◈</span>'
            + '<span class="hero-text" style="color:var(--llm)">' + esc(reply) + '</span>');
          break;
        }
        case 'llm_unreachable':
          _setHeroContent('<span class="hero-icon" style="color:var(--nomatch)">✗</span>'
            + '<span class="hero-text" style="color:var(--nomatch)">remote agent unreachable</span>');
          heroAnim('anim-nomatch', 500);
          break;
        default:
          _setHeroContent('<span class="hero-icon hero-muted">○</span>'
            + '<span class="hero-text hero-muted">STT inactive</span>');
      }
    }

    const MAX_LOG = 300;

    // ── sparkline ────────────────────────────────────────────────────────────
    let _sparkData = [];
    let _cpuLimit = 4;

    function _cpuColor(v, maxY) {
      const r = v / maxY;
      if (r >= 0.9) return '#f87171';
      if (r >= 0.6) return '#facc15';
      return '#4ade80';
    }

    function updateSparkline(m) {
      const load1  = m.load1  || 0;
      const load5  = m.load5  || 0;
      const load15 = m.load15 || 0;
      _sparkData.push(load1);
      if (_sparkData.length > 60) _sparkData.shift();

      const ramFreePct = m.ram_free_pct != null ? m.ram_free_pct : null;
      if (ramFreePct != null) {
        const ramUsed = 100 - ramFreePct;
        const ramColor = ramUsed > 90 ? '#f87171' : ramUsed > 75 ? '#facc15' : '#4ade80';
        const elRam = document.getElementById('ram-free-pct');
        const barRam = document.getElementById('ram-free-bar');
        if (elRam) { elRam.textContent = ramUsed.toFixed(0) + '%'; elRam.style.color = ramColor; }
        if (barRam) { barRam.style.width = ramUsed.toFixed(1) + '%'; barRam.style.backgroundColor = ramColor; }
      }

      const svg = document.getElementById('sparkline');
      if (!svg) return;

      const w = 200, h = 76;
      const cpuCount = m.cpu_count || 1;
      const maxY = _cpuLimit;
      const color = _cpuColor(load1, maxY);
      const n = _sparkData.length;

      const pad = { t: 6, b: 6, l: 2, r: 2 };
      const cw = w - pad.l - pad.r;
      const ch = h - pad.t - pad.b;

      const toX = i => pad.l + (i / (n - 1 || 1)) * cw;
      const toY = v => pad.t + ch - Math.min(ch, Math.max(0, (v / maxY) * ch));

      const pts = _sparkData.map((v, i) => ({ x: toX(i), y: toY(v), c: _cpuColor(v, maxY) }));

      // smooth cubic bezier path
      function smooth(points) {
        if (points.length < 2) return '';
        let d = 'M' + points[0].x.toFixed(1) + ',' + points[0].y.toFixed(1);
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1], p1 = points[i];
          const cx = (p0.x + p1.x) / 2;
          d += ' C' + cx.toFixed(1) + ',' + p0.y.toFixed(1) + ' ' + cx.toFixed(1) + ',' + p1.y.toFixed(1) + ' ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1);
        }
        return d;
      }

      const linePath = smooth(pts);
      const last = pts[pts.length - 1] || { x: pad.l, y: pad.t + ch };
      const fillPath = linePath + ' L' + last.x.toFixed(1) + ',' + (pad.t + ch) + ' L' + pad.l + ',' + (pad.t + ch) + 'Z';

      // grid lines at 25 / 50 / 75 % of maxY
      const gridLines = [0.25, 0.5, 0.75].map(f => {
        const gy = toY(f * maxY);
        return '<line x1="' + pad.l + '" y1="' + gy.toFixed(1) + '" x2="' + (w - pad.r) + '" y2="' + gy.toFixed(1) + '" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>';
      }).join('');

      // 1-core load threshold dashed line
      const threshY = toY(2);
      const threshLine = threshY >= pad.t && threshY <= pad.t + ch
        ? '<line x1="' + pad.l + '" y1="' + threshY.toFixed(1) + '" x2="' + (w * 0.55).toFixed(1) + '" y2="' + threshY.toFixed(1) + '" stroke="var(--info)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.55"/>'
        : '';

      svg.innerHTML =
        '<defs>'
        + '<linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">'
        + pts.map((p, i) => '<stop offset="' + (i / (n - 1 || 1) * 100).toFixed(0) + '%" stop-color="' + p.c + '"/>').join('')
        + '</linearGradient>'
        + '<linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.35"/>'
        + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0.0"/>'
        + '</linearGradient>'
        + '<filter id="glow" x="-20%" y="-60%" width="140%" height="220%">'
        + '<feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>'
        + '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'
        + '</filter>'
        + '</defs>'
        + gridLines
        + threshLine
        + '<path d="' + fillPath + '" fill="url(#fg)"/>'
        + '<path d="' + linePath + '" fill="none" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>'
        + '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="3" fill="' + color + '" opacity="0.9" filter="url(#glow)">'
        + '<animate attributeName="opacity" values="0.9;0.25;0.9" dur="1.8s" repeatCount="indefinite"/>'
        + '</circle>';

      const cpuLoad = document.getElementById('cpu-load');
      if (cpuLoad) { cpuLoad.textContent = load1.toFixed(2); cpuLoad.style.color = color; }

      const badge = document.getElementById('cpu-cores-badge');
      if (badge) badge.textContent = cpuCount + ' core' + (cpuCount !== 1 ? 's' : '');

      const el5   = document.getElementById('cpu-load5');
      const el15  = document.getElementById('cpu-load15');
      const bar5  = document.getElementById('cpu-bar5');
      const bar15 = document.getElementById('cpu-bar15');
      if (el5)  { el5.textContent  = load5.toFixed(2);  el5.style.color  = _cpuColor(load5,  maxY); }
      if (el15) { el15.textContent = load15.toFixed(2); el15.style.color = _cpuColor(load15, maxY); }
      if (bar5)  { bar5.style.width  = Math.min(100, load5  / maxY * 100).toFixed(1) + '%'; bar5.style.backgroundColor  = _cpuColor(load5,  maxY); }
      if (bar15) { bar15.style.width = Math.min(100, load15 / maxY * 100).toFixed(1) + '%'; bar15.style.backgroundColor = _cpuColor(load15, maxY); }
    }

    // ── init ──────────────────────────────────────────────────────────────────
    (function() {
      const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const btn = document.getElementById('btn-theme');
      if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀';
      const savedMode = localStorage.getItem('dashboard-mode') || 'user';
      applyMode(savedMode);
      if (localStorage.getItem('monitor-collapsed') === '1') {
        const sec = document.getElementById('monitoring-section');
        if (sec) sec.classList.add('collapsed');
      }
      if (localStorage.getItem('history-collapsed') === '1') {
        const sec = document.getElementById('history-section');
        if (sec) sec.classList.add('collapsed');
      }
      if (localStorage.getItem('log-collapsed') === '1') {
        const sec = document.getElementById('log-panel');
        if (sec) sec.classList.add('collapsed');
      }
    })();

    connect();

    // Follow OS preference changes unless user has a stored override
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'light' : 'dark');
    });
  </script>
</body>
</html>
