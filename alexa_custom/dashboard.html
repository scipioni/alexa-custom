<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alexa-custom</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" media="print" onload="this.media='all'" />  <div id="main">

    <div class="center-col">
      <div id="hero">
        <span class="hero-inner">
          <span class="stt-wave wv-idle"><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span></span>          <span class="hero-text hero-muted">STT inactive</span>
        </span>
      </div>

      <div class="panel" id="ww-tree-panel">
        <div class="panel-hdr">TRIGGERS</div>
        <div id="ww-graph-wrap"><canvas id="ww-graph-canvas"></canvas></div>
      </div>

      <div class="panel" id="log-panel">
        <div class="panel-hdr clickable" onclick="toggleLog()">LOGS <span style="margin-right:auto"></span><button onclick="event.stopPropagation();clearLogs()">clear</button><span id="log-toggle-icon">▾</span></div>
        <div id="log-content">
          <div id="le"></div>
        </div>
      </div>
    </div>

    <div class="hist-col">
      <div class="panel" id="history-section">
        <div class="panel-hdr">HISTORY <span style="margin-right:auto"></span><button onclick="event.stopPropagation();clearHistory()">clear</button></div>
        <div id="hist-content">
          <div id="hist-empty" style="padding: 16px 12px; font-size: 11px; color: var(--muted); text-align: center; font-style: italic;">No events</div>
          <div id="hl"></div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel" id="toggles-panel">
        <div id="ws-status">
          <div class="sdot" id="cdot"></div>
          <span id="ws-ind">WS connecting…</span>
        </div>
        <div id="toggles-body">
          <button id="btn-mode" class="material-symbols-outlined" aria-label="Toggle mode" onclick="toggleMode()">code</button>
          <button id="btn-theme" class="material-symbols-outlined" aria-label="Toggle theme" onclick="toggleTheme()">light_mode</button>
          <button id="btn-restart" aria-label="Restart" onclick="sendCtrl('restart')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
          <button id="btn-config" class="material-symbols-outlined" aria-label="Edit configuration" onclick="openConfigModal()">settings</button>        </div>
      </div>
      <div id="morph-overlay"></div>

      <div class="panel" id="room-panel">
        <div class="panel-hdr">ROOM<span id="room"></span></div>
        <div id="room-body">
          <div id="room-status-body">
            <span class="rs-icon material-symbols-outlined" id="rs-icon">phone_disabled</span>
            <div>
              <div class="rs-label" id="rs-label">Closed</div>
              <div class="rs-sub" id="rs-sub">No active call</div>
              <div id="room-participants-list" style="display:none;margin-top:4px;font-size:11px"></div>
            </div>
            <div id="donut-wrap">
              <svg id="donut-svg" viewBox="0 0 36 36">
                <circle id="donut-track" cx="18" cy="18" r="15"/>
                <circle id="donut-fill" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="0"/>
              </svg>
              <span id="donut-label"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" id="monitoring-section">
        <div class="panel-hdr clickable" onclick="toggleMonitor()">MONITOR<span id="mon-toggle-icon">▾</span></div>
        <div id="mon-content">
          <div id="cpu-widget">
            <div id="cpu-header">
              <span id="cpu-title">CPU Load Avg</span>
              <span id="cpu-cores-badge"></span>
            </div>
            <div id="cpu-chart-wrap">
              <svg id="sparkline" viewBox="0 0 200 76" preserveAspectRatio="none"></svg>
              <div id="cpu-overlay">
                <span id="cpu-load">0.00</span>
                <span id="cpu-load-label">1 min avg</span>              </div>
            </div>
            <div id="cpu-secondary">
              <div class="cpu-stat-chip">
                <div class="cpu-stat-top">
                  <span class="cpu-sec-lbl">5m</span>
                  <span class="cpu-sec-val" id="cpu-load5">—</span>
                </div>
                <div class="cpu-stat-bar-track"><div class="cpu-stat-bar-fill" id="cpu-bar5"></div></div>
              </div>
              <div class="cpu-stat-chip">
                <div class="cpu-stat-top">
                  <span class="cpu-sec-lbl">15m</span>
                  <span class="cpu-sec-val" id="cpu-load15">—</span>
                </div>
                <div class="cpu-stat-bar-track"><div class="cpu-stat-bar-fill" id="cpu-bar15"></div></div>
              </div>
              <div class="cpu-stat-chip">
                <div class="cpu-stat-top">
                  <span class="cpu-sec-lbl">RAM</span>
                  <span class="cpu-sec-val" id="ram-free-pct">—</span>
                </div>
                <div class="cpu-stat-bar-track"><div class="cpu-stat-bar-fill" id="ram-free-bar"></div></div>
              </div>
            </div>
          </div>
<div id="vu-bottom">
              <div class="vu-block">
                <div class="vu-row-v">
                  <span class="vu-lbl-v">MIC</span>
                  <div class="vu-segs-v" id="mic-segs-v"><div class="rms-line" id="mic-rms-line"></div></div>
                  <span class="vu-db" id="mic-db">-∞ dB</span>
                  <span class="vu-gain" id="mic-gain"></span>
                </div>
                <div class="vu-row-v">
                  <span class="vu-lbl-v">SPK</span>
                  <div class="vu-segs-v" id="spk-segs-v"></div>
                  <span class="vu-db" id="spk-db">-∞ dB</span>
                </div>
                <div class="vu-vol-col">
                  <span class="vu-lbl-v">VOL</span>
                  <div class="vol-slider-wrap">
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                  </div>
                  <span class="vu-db" id="volume-percent">50%</span>
                </div>
              </div>
           </div>
        </div>
      </div>


      <div class="panel" id="ai-panel">
        <div id="ai-section" style="display:none">
          <div class="panel-hdr">AI FALLBACK<span id="llm-model-name"></span></div>
          <div id="ai-content" style="padding:8px 12px;font-size:12px"></div>
        </div>
      </div>
    </div>

  </div>

<script src="/static/dashboard.js" defer></script>

      <div id="config-modal" class="hidden">
        <div class="modal-overlay" onclick="closeConfigModal()"></div>
        <div class="modal-content">
          <div class="modal-header">
            <h2>⚙️ Configuration</h2>
            <button onclick="closeConfigModal()" style="background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;">✕</button>
          </div>
          <div class="modal-body" id="config-form">
            <!-- Form fields will be rendered here -->
          </div>
<div class="modal-footer">
          <button onclick="resetConfigForm()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:6px;cursor:pointer;">Reset</button>
          <button onclick="closeConfigModal()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:6px;cursor:pointer;">Cancel</button>
          <button onclick="saveConfig()" style="background:var(--info);border:none;color:#000;padding:8px 16px;border-radius:6px;cursor:pointer;">Save Changes</button>
        </div>
        </div>
      </div></body>
</html>
