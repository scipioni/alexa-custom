# conf/actions/system.yaml — system-provided actions
#
# This file is loaded first (highest priority).
# on_startup is only honoured in this file; it is ignored in all other action files.

on_startup:
  - type: say
    text: "Sistema pronto"
    lang: "it-IT"

# ---------------------------------------------------------------------------
# Global triggers — active for every wake word group
# ---------------------------------------------------------------------------
triggers:
  - phrase: "che ora è"
    aliases:
      - "che ore sono"
    actions:
      - type: say
        text: "$(date +'Sono le %H e %M')"

  - phrase: "che giorno è"
    aliases:
      - "che giorno è oggi"
    actions:
      - type: say_date

  - phrase: "riavvia"
    actions:
      - type: shell
        command: "systemctl --user restart alexa-client"

  - phrase: "chatta con me"
    actions:
      - type: llm_chat

  - phrase: "impara nuovo comando"
    actions:
      - type: llm_learn

  - phrase: "Volume basso"
    actions:
      - type: set_volume
        mode: absolute
        value: 0.1

  - phrase: "Volume medio"
    actions:
      - type: set_volume
        mode: absolute
        value: 0.5

  - phrase: "Volume alto"
    actions:
      - type: set_volume
        mode: absolute
        value: 0.9
