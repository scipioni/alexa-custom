# conf/actions/system.yaml — system-provided actions
#
# This file is loaded first (highest priority).
# on_startup is only honoured in this file; it is ignored in all other action files.

on_startup:
  - type: say
    text: "Sistema pronto"
    lang: "it-IT"

# ---------------------------------------------------------------------------
# Global triggers — active for every wake word group
# ---------------------------------------------------------------------------
triggers:
  - phrase: "che ora è"
    aliases:
      - "che ore sono"
    actions:
      - type: say
        text: "$(date +'Sono le %H e %M')"

  - phrase: "che giorno è"
    aliases:
      - "che giorno è oggi"
    actions:
      - type: say
        text: "$(date +'Oggi è %A %d %B %Y')"

  - phrase: "riavvia"
    actions:
      - type: shell
        command: "systemctl --user restart alexa-client"

  - phrase: "chatta con me"
    actions:
      - type: llm_chat

  - phrase: "impara nuovo comando"
    actions:
      - type: llm_learn

  - phrase: "volume al"
    actions:
      - type: set_volume_from_transcript

  - phrase: "volume basso"
    actions:
      - type: set_volume
        mode: absolute
        value: 0.1
      - type: say
        text: "volume basso"

  - phrase: "volume medio"
    actions:
      - type: set_volume
        mode: absolute
        value: 0.5
      - type: say
        text: "volume medio"

  - phrase: "volume alto"
    actions:
      - type: set_volume
        mode: absolute
        value: 0.9
      - type: say
        text: "volume alto"
  
  - phrase: "alza il volume"
    actions:
      - type: set_volume
        mode: up
        step: 0.1
      - type: say
        text: "volume più alto"

  - phrase: "abbassa il volume"
    actions:
      - type: set_volume
        mode: down
        step: 0.1
      - type: say
        text: "volume più basso"
