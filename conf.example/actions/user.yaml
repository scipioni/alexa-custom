# conf/actions/user.yaml — user-defined triggers and wake words
#
# Edit freely. This file is hot-reloaded every ~config_poll_interval seconds.
# The learning agent (llm_learn) appends new commands to conf/actions/learned.yaml.
#
# Schema:
#   wake_words:  extra wake phrases (flat string list, merged with conf/config.yaml)
#   triggers:    flat list of triggers
#     commands: [...]        list of recognised phrases (first is the canonical name)
#     with_wake: true/false  true (default) = fires only after a wake word;
#                            false = direct match, no wake word required
#     patterns: [...]        optional word-glob patterns tested before fuzzy matching
#     actions: [...]         list of action entries

# ---------------------------------------------------------------------------
# Extra wake words (optional)
# Flat list of additional phrases merged into the global wake-word list.
# ---------------------------------------------------------------------------
#wake_words:
#- "aiuto"
#  - "aiutami"

