  - commands:
      - "accendi la luce"
    patterns:
      - "accend* * luc*"          # accendi/accenda/accendere … luci/luce
      - "mett* * luc*"            # metti/mettere la luce
    actions:
      - type: mqtt_publish
        topic: "home/light/set"
        payload: "ON"

# ---------------------------------------------------------------------------
# Follow-up — per-trigger override
#
# When recognition.follow_up is enabled globally, individual triggers can
# override the behaviour:
#   follow_up: false   — do not open a follow-up window after this command
#   follow_up: true    — always open the window, even if the global flag is off
# ---------------------------------------------------------------------------

  # - commands:
  #     - "buonanotte"
  #   follow_up: false        # close the conversation after this command
  #   actions:
  #     - type: say
  #       text: "Buonanotte!"

# ---------------------------------------------------------------------------
# Domotica — esempi con pattern word-glob
#
# I pattern vengono testati PRIMA della corrispondenza fuzzy.
# Sintassi:
#   accend*    = parola che inizia con "accend" (accendi/accenda/accendere/…)
#   *          = qualsiasi numero di parole intermedie (anche zero)
#   luci       = token letterale — abbinato foneticamente (luce ≈ luci)
# ---------------------------------------------------------------------------

