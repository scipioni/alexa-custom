# conf/actions/user.yaml — user-defined triggers and wake words
#
# Edit freely. This file is hot-reloaded every ~config_poll_interval seconds.
# The learning agent (llm_learn) appends new commands to conf/actions/learned.yaml.
#
# Schema:
#   wake_words:      extra wake word groups (merged with conf/config.yaml)
#   triggers:        flat list of triggers; scope set via optional 'wake_words' field:
#                      absent            → active after any wake word (global)
#                      wake_words: []    → direct match (no wake word required)
#                      wake_words: [id]  → active only after the named wake word group

# ---------------------------------------------------------------------------
# Extra wake word groups (optional)
# Define groups here instead of a separate conf/user.yaml file.
# Groups whose id already exists in conf/config.yaml are skipped.
# ---------------------------------------------------------------------------
wake_words:
  - word: "aiuto"
    id: help          # stable key used in wake_words trigger scoping (defaults to word)
    aliases:
      - "aiutami"
    skip_unmatched_inline: true

# ---------------------------------------------------------------------------
# Triggers — active for every wake word group (no wake_words field = global)
# ---------------------------------------------------------------------------
triggers:
