# conf/actions/user.yaml — user-defined triggers
#
# Edit freely. This file is hot-reloaded every ~config_poll_interval seconds.
# The learning agent (llm_learn) appends new commands to conf/actions/learned.yaml.
#
# Schema:
#   triggers:        global fallback triggers (active for all wake words)
#   wake_triggers:   per-wake-word trigger lists (keyed by wake word string)

# ---------------------------------------------------------------------------
# Global triggers — active for every wake word group
# ---------------------------------------------------------------------------
triggers:
  - phrase: "test"
    actions:
      - type: log
        message: "command recognition working"

  - phrase: "di qualcosa"
    actions:
      - type: say
        text: "Ciao dal sistema vocale"
        lang: "it-IT"

  - phrase: "suona"
    actions:
      - type: tone
        name: info

  - phrase: "aggiorna"
    actions:
      - type: shell
        command: "systemctl --user restart alexa-client"

  - phrase: "connettiti"
    actions:
      - type: livekit_join

  - phrase: "manda messaggio"
    actions:
      - type: telegram
        text: "Messaggio vocale ricevuto"

  - phrase: "accendi la luce"
    patterns:
      - "accend* * luc*"          # accendi/accenda/accendere … luci/luce
      - "mett* * luc*"            # metti/mettere la luce
    actions:
      - type: mqtt_publish
        topic: "home/light/set"
        payload: "ON"

# ---------------------------------------------------------------------------
# Domotica — esempi con pattern word-glob
#
# I pattern vengono testati PRIMA della corrispondenza fuzzy.
# Sintassi:
#   accend*    = parola che inizia con "accend" (accendi/accenda/accendere/…)
#   *          = qualsiasi numero di parole intermedie (anche zero)
#   luci       = token letterale — abbinato foneticamente (luce ≈ luci)
# ---------------------------------------------------------------------------

  # Luci
  - phrase: "spegni le luci"
    patterns:
      - "spegn* * luc*"
    actions:
      - type: mqtt_publish
        topic: "home/light/set"
        payload: "OFF"

  # Riscaldamento
  - phrase: "alza il riscaldamento"
    patterns:
      - "alz* * riscaldament*"
      - "aumenta * temperatura"
      - "ho * freddo"
    actions:
      - type: mqtt_publish
        topic: "home/climate/heat"
        payload: "UP"

  - phrase: "abbassa il riscaldamento"
    patterns:
      - "abbass* * riscaldament*"
      - "diminuisc* * temperatura"
      - "ho * caldo"
    actions:
      - type: mqtt_publish
        topic: "home/climate/heat"
        payload: "DOWN"

  # Tapparelle
  - phrase: "alza le tapparelle"
    patterns:
      - "alz* * tapparell*"
      - "apr* * tapparell*"
    actions:
      - type: mqtt_publish
        topic: "home/shutters"
        payload: "UP"

  - phrase: "abbassa le tapparelle"
    patterns:
      - "abbass* * tapparell*"
      - "chiud* * tapparell*"
    actions:
      - type: mqtt_publish
        topic: "home/shutters"
        payload: "DOWN"

  # Televisione
  - phrase: "accendi la tv"
    patterns:
      - "accend* * tv"
      - "accend* * televisor*"
      - "mett* * tv"
    actions:
      - type: mqtt_publish
        topic: "home/tv"
        payload: "ON"

  - phrase: "spegni la tv"
    patterns:
      - "spegn* * tv"
      - "spegn* * televisor*"
    actions:
      - type: mqtt_publish
        topic: "home/tv"
        payload: "OFF"

# ---------------------------------------------------------------------------
# Assistenza anziani — pattern ampi per massimizzare il riconoscimento
#
# Per i trigger di emergenza la priorità è il RECALL: meglio un falso
# positivo raro che perdere una richiesta di aiuto reale.
# ---------------------------------------------------------------------------

  # Emergenza medica
  - phrase: "chiama il medico"
    patterns:
      - "chiam* * medico"
      - "ho * bisogno * medico"
      - "serve * medico"
    actions:
      - type: telegram
        text: "⚠️ Richiesta di aiuto: chiamare il medico"
      - type: say
        text: "Sto avvisando i tuoi familiari."

  - phrase: "chiama i soccorsi"
    patterns:
      - "chiam* * carabinier*"
      - "chiam* * polizia"
      - "chiam* * emergenza"
      - "chiam* * soccorso"
    actions:
      - type: telegram
        text: "🚨 Emergenza: richiesta aiuto urgente"
      - type: say
        text: "Sto chiamando i soccorsi."

  # Non sto bene
  - phrase: "non sto bene"
    patterns:
      - "non * bene"
      - "sto * male"
      - "mi * male"
    actions:
      - type: telegram
        text: "⚠️ Non si sente bene"
      - type: say
        text: "Ho avvisato i tuoi familiari. Come posso aiutarti?"

  # Caduta
  - phrase: "sono caduto"
    patterns:
      - "son* cadat*"
      - "son* cadut*"
      - "mi son* fat* male"
    actions:
      - type: telegram
        text: "🚨 Possibile caduta — verificare immediatamente"
      - type: say
        text: "Avviso i tuoi familiari. Cerca di non muoverti."

  # Chiamata familiare
  - phrase: "chiama la famiglia"
    patterns:
      - "chiam* * figli*"
      - "chiam* * famiglia"
      - "voglio * parlar* * figli*"
    actions:
      - type: livekit_join

  # Medicine
  - phrase: "ho preso le medicine"
    patterns:
      - "pres* * medicin*"
      - "pres* * farmac*"
      - "pres* * pastiglie"
    actions:
      - type: mqtt_publish
        topic: "care/medication/taken"
        payload: "true"
      - type: say
        text: "Perfetto, ho segnato che hai preso le medicine."

  - phrase: "non ho preso le medicine"
    patterns:
      - "non * pres* * medicin*"
      - "dimentica* * medicin*"
    actions:
      - type: say
        text: "Ti ricordo di prendere le medicine adesso."
      - type: mqtt_publish
        topic: "care/medication/missed"
        payload: "true"

  # Check-in benessere
  - phrase: "sto bene grazie"
    patterns:
      - "sto * bene"
      - "mi sent* * bene"
      - "tutto * bene"
    actions:
      - type: mqtt_publish
        topic: "care/checkin/status"
        payload: "ok"
      - type: say
        text: "Sono contento. Buona giornata!"

# ---------------------------------------------------------------------------
# Per-wake-word triggers
# ---------------------------------------------------------------------------
wake_triggers:
  help:
    - phrase: "chiama assistenza"
      aliases: ["chiama","aiuto"]
      actions:
        - type: ask
          text: "Vuoi chiamare assistenza ?"
          lang: "it-IT"
          timeout: 5.0
          on_reply:
            - phrase: "si"
              actions:
                - type: say
                  text: "Sto chiamando l'assitenza"
                - type: livekit_join
                - type: telegram
                  text: "Collegati con casa <room>"
            - phrase: "no"
              actions:
                - type: say
                  text: "Chiamata annullata"
          on_else:
            - type: say
              text: "Non ho capito"

