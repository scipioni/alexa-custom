  - commands:
      - "chiama Stefano"
    with_wake: false
    actions:
      - type: ask
        text: "Vuoi chiamare Stefano?"
        lang: "it-IT"
        timeout: 5.0
        on_reply:
          - commands: ["si", "sì", "si si", "sì sì", "va bene", "certo", "ok", "dai"]
            actions:
              - type: say
                text: "Sto chiamando Stefano"
              - type: livekit_join
              - type: telegram
                text: "Collegati con casa <room>"
          - commands: ["no", "no no", "no grazie", "annulla"]
            actions:
              - type: say
                text: "Chiamata annullata"
        on_else:
          - type: say
            text: "Non ho capito"

  - commands:
      - "chiama assistenza"
      - "chiama"
      - "aiuto"
    with_wake: false
