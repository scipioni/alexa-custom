  - phrase: "accendi la luce"
    patterns:
      - "accend* * luc*"          # accendi/accenda/accendere … luci/luce
      - "mett* * luc*"            # metti/mettere la luce
    actions:
      - type: mqtt_publish
        topic: "home/light/set"
        payload: "ON"

# ---------------------------------------------------------------------------
# Follow-up — per-trigger override
#
# Quando recognition.follow_up è abilitato globalmente, i singoli trigger
# possono sovrascrivere il comportamento:
#   follow_up: false   — non aprire la finestra dopo questo comando
#   follow_up: true    — apri sempre la finestra anche se il flag globale è off
# ---------------------------------------------------------------------------

  # - phrase: "buonanotte"
