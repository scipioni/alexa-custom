# conf/config.yaml.example — all supported configuration keys with comments
#
# Copy to conf/config.yaml and edit as needed.
# Credentials (LiveKit, Telegram, LLM, MQTT passwords) go in conf/secrets.yaml.
# Custom triggers and extra wake words go in conf/actions/user.yaml.
# This file is hot-reloaded every ~system.config_poll_interval seconds.


# ---------------------------------------------------------------------------
# Wake words
# ---------------------------------------------------------------------------
# Flat list of phrases that activate the assistant. All variants and aliases
# belong in this list — the STT model matches any of them.
# Extra phrases can also be added from conf/actions/*.yaml via a 'wake_words:' key.
wake_words:
  - "ehi serena"
  - "ascolta assistente"
  # - "ehi assistente"


# ---------------------------------------------------------------------------
# Recognition
# ---------------------------------------------------------------------------
recognition:
  wake_window: 8.0          # seconds after a wake word to listen for a command
  wake_tone: wake           # tone on wake: wake | startup | success | error | info | warning | none
  matching_algorithm: token_sort_ratio  # token_sort_ratio | token_set_ratio | levenshtein | ratio
  matching_threshold: 75.0              # similarity threshold (0-100)
  #   token_sort_ratio (default) is order-tolerant AND length-aware, so a single
  #   word ("sono") cannot falsely match a longer command ("che ore sono").
  #   token_set_ratio scores token-subsets as 100 and is prone to such false fires.
  # min_word_overlap: 0.0  # extra lexical guard layered on top of the fuzzy score:
  #   fraction of a trigger phrase's content words that must appear verbatim in the
  #   transcript before fuzzy scoring runs. 0.0 (default) — off, token_sort_ratio
  #   already prevents subset false-fires; 0.5 — half the words must be present;
  #   1.0 — all words required. Individual triggers can override via min_word_overlap.
  # post_dispatch_cooldown_ms: 800  # silence listening for this many ms after any
  #   successful dispatch. Prevents immediate re-activation from acoustic echo.
  # min_cmd_words: 1  # minimum word count in the recognised command before fuzzy
  #   trigger matching runs. Raise to 2 to block single-phoneme noise.
  reply_matching_algorithm: levenshtein  # token_sort_ratio | token_set_ratio | levenshtein | ratio
  reply_matching_threshold: 80.0         # similarity threshold (0-100)
  # follow_up: false          # re-open command window after a match without re-waking
  # follow_up_timeout: 4.0    # seconds of silence before the follow-up window closes
  # follow_up_max_turns: 5    # max consecutive follow-up turns (runaway guard)
  # follow_up_tone: info      # chime played when the follow-up window opens

# ---------------------------------------------------------------------------
# STT — speech-to-text
# ---------------------------------------------------------------------------
# Single always-on model: continuously transcribes and matches wake words +
# commands in one pass (no two-stage pipeline).
stt:
  backend: vosk             # vosk | sherpa-onnx
  # model_path: models/it
  vad_silence_ms: 900       # ms of silence after last speech before endpoint fires
  #   900 ms confirmed clean on-board (no utterance fragmentation).
  #   Perceived latency ≈ vad_silence_ms + ~130 ms decode. 700–800 ms is viable
  #   if ~1 s feels slow.
  rms_threshold: 0.02       # minimum RMS energy considered speech
  adaptive_rms: true        # dynamically adjusts rms_threshold based on noise floor
  # min_speech_ms: 200      # minimum sustained speech before silence timer starts
  # wake_match_threshold: 0.5  # fraction of wake-phrase tokens that must appear in
  #   the transcript to count as a hit. 0.5 (default) — one of two words is enough
  #   (handles "ehi" transcribed as "e"/"ei"); 1.0 — exact match required.
  # num_threads: 2           # ONNX threads (sherpa-onnx only; ignored by vosk)
  # flush_ms: 300            # audio discarded after wake beep (absorbs speaker echo)

# ---------------------------------------------------------------------------
# TTS — text-to-speech
# ---------------------------------------------------------------------------
tts:
  backend: piper           # piper | pico
  voice: it_IT-paola-medium  # Piper voice name (run 'alexa-setup --piper-voice <name>')
  preroll_ms: 100          # silence prepended to TTS audio (covers PipeWire cold-start)

# ---------------------------------------------------------------------------
# Audio hardware
# ---------------------------------------------------------------------------
audio:
  #card_name: NewPie        # substring to identify audio card in PipeWire/ALSA
  input_device: pipewire   # PipeWire source name substring, or 'pipewire' for default
  output_device: pipewire  # PipeWire sink name substring, or 'pipewire' for default
  output_volume: 0.5       # speaker volume 0.0–1.0 (set via wpctl, persisted by WirePlumber)
  input_gain: 1.0          # microphone gain multiplier (1.0 = no change, 2.0 = double)
  post_playback_ms: 300    # STT gate hold after playback ends (lets echo decay)
  tone_preroll_ms: 50      # silence before tones/beeps (covers PipeWire cold-start)
  sample_rates:
    usb: 48000
    bluetooth: 16000
    internal: 48000
  webrtc:                  # LiveKit WebRTC microphone processing (all default to true)
    agc: true              # Automatic Gain Control
    aec: true              # Acoustic Echo Cancellation
    noise_suppression: true
    high_pass_filter: true

# ---------------------------------------------------------------------------
# LLM (Ollama)
# ---------------------------------------------------------------------------
llm:
  backend: ollama
  # host is set in conf/secrets.yaml as 'llm_host'
  model: ssfdre38/gemma4-nano   # model name as shown by 'ollama list'
  context_turns: 10             # conversation pairs kept in history
  context_window_secs: 60       # inactivity seconds before history resets
  fallback_on_no_match: false   # route unmatched commands to LLM
  learn_commands: true          # enable llm_learn action type
  request_timeout: 60.0         # HTTP request timeout
  # system_prompt: null         # optional override for the default system prompt

# ---------------------------------------------------------------------------
# MQTT / Home Assistant
# ---------------------------------------------------------------------------
# Omit this section to disable MQTT entirely.
# mqtt:
#   host: 127.0.0.1        # broker hostname; required to enable MQTT
#   port: 1883
#   topic_prefix: alexa
#   node_id: living_room   # defaults to system hostname
#   queue_max: 200         # max queued outgoing messages while broker is unreachable

# ---------------------------------------------------------------------------
# Web dashboard
# ---------------------------------------------------------------------------
# web:
#   port: 8080
#   history_file: conf/history.jsonl

# ---------------------------------------------------------------------------
# Action files
# ---------------------------------------------------------------------------
actions:
  dir: conf/actions                         # directory auto-discovered for .yaml files
  learn_file: conf/actions/learned.yaml    # file the llm_learn action appends to
  # dump_triggers_dir: /tmp/trigger_dumps  # save pre-trigger audio WAV here on every fire

# ---------------------------------------------------------------------------
# Visual display feedback (Arduino UNO Q only)
# ---------------------------------------------------------------------------
# Uses the board's built-in LED matrix (8×13) and RGB LEDs.
# Set enabled to false or omit this section to disable visual feedback entirely.
display:
  enabled: false
  backend: auto           # auto | bridge | gpio | mock | i2c
  transport: unix        # auto | subprocess | unix | tcp (bridge backend only)
  matrix_brightness: 50   # 0-100
  led_brightness: 50      # 0-100

# ---------------------------------------------------------------------------
# System tuning
# ---------------------------------------------------------------------------
# system:
#   reconnect_delay: 5         # seconds between LiveKit reconnect attempts
#   config_poll_interval: 2    # hot-reload polling interval in seconds
#   empty_room_timeout: 0      # disconnect after N seconds with no participants (0 = never)
#   wait_for_participant: true  # join room silently and wait for a remote participant before going live
#   answer_timeout: 60         # seconds to wait for a participant before disconnecting (wait_for_participant only)
