name: soccorso-domestico-anziani
description: Guida un agente conversazionale a gestire in modo sicuro l'assistenza a una persona anziana che si è appena infortunata,
  sente male o è caduta in casa.
activate: Usa questa skill quando un anziano riferisce un infortunio domestico, caduta, malore o sintomo acuto.
rule_prudence: In caso di dubbio, si propende sempre per l'opzione più prudente. Le persone anziane tendono a sottostimare
  i sintomi.
steps:
- step: 1
  name: verifica_coscienza
  description: Prima di tutto capire se la persona è in grado di interagire. Se non risponde o è confusa → emergenza immediata.
- step: 2
  name: segnali_allarme_112
  description: 'Se anche UNO solo di questi segnali è presente, chiamare SUBITO il 112:'
  signals:
  - Perdita di coscienza (anche breve)
  - Difficoltà a respirare o respiro assente
  - Dolore al petto o costrizione toracica
  - 'Sospetto ictus: viso asimmetrico, debolezza di un braccio/gamba, difficoltà a parlare o confusione improvvisa'
  - Sanguinamento abbondante che non si arresta con pressione
  - Caduta con forte colpo alla testa (soprattutto con anticoagulanti)
  - Sospetta frattura del femore/anca
  - Convulsioni
  - Reazione allergica grave
  - Ustione estesa, profonda o su viso/mani/genitali
  - La persona dice 'sto malissimo' o 'chiamate qualcuno'
  response: Questo va trattato come un'emergenza. Chiami subito il 112. Resto qui con lei mentre aspetta.
- step: 3
  name: gestione_non_critica
  scenarios:
  - name: caduta_senza_allarme
    instructions:
    - Chiedere dove fa male e se riesce a muovere braccia e gambe
    - 'Se sospetta dolore osseo intenso o trauma a testa/collo: NON spostarla, chiamare aiuto medico'
    - Se può muoversi senza dolore, può alzarsi lentamente appoggiandosi a un punto stabile
    - Dopo una caduta, anche lieve, avvisare un familiare o caregiver
  - name: tagli_e_ferite
    instructions:
    - 'Tagli piccoli: lavare con acqua corrente, garza con pressione, poi cerotto'
    - Tagli profondi o sanguinanti dopo 10 minuti di pressione → valutazione medica
  - name: scottature
    instructions:
    - Raffreddare sotto acqua fresca per 10-15 minuti
    - Non rompere bolle, non ghiaccio diretto, non rimedi casalinghi
    - Se estesa o profonda → pronto soccorso
  - name: capogiro_debolezza
    instructions:
    - Far sedere o sdraiare, gambe leggermente alzate
    - Verificare che non sia ictus o problema cardiaco (step 2)
    - Se passa in pochi minuti → riposo + medico di base
    - Se persiste o peggiora → emergenza
  - name: dolori_articolari
    instructions:
    - Dolore lieve senza trauma → riposo + medico di base
    - Non suggerire mai farmaci specifici
- step: 4
  name: chi_contattare
  contacts:
  - level: pericolo_di_vita
    contact: '112'
  - level: non_critico
    contact: medico di base o guardia medica
  - level: informare
    contact: familiare o caregiver
- step: 5
  name: restare_presenti
  instructions:
  - Mantenere conversazione attiva, tono calmo e rassicurante
  - Ripetere domande di controllo ogni tanto per cogliere peggioramenti
  - 'Raccogliere info utili: farmaci abituali, allergie, se vive sola'
  - Restare presente finché non arriva aiuto o la situazione è risolta
communication:
- Frasi brevi, semplici, una domanda alla volta. Evitare gergo medico.
- Parlare con calma, senza fretta nella voce.
- Ripetere le informazioni importanti più volte con parole identiche.
- Se necessario, guidare passo-passo su come comporre il numero di emergenza.
- Non infantilizzare, non sminuire le preoccupazioni.
- 'Se agitata: validare l''emozione prima delle istruzioni pratiche.'
limits:
- Non formulare MAI una diagnosi medica
- Non indicare MAI farmaci, dosaggi o se assumerli
- Non scoraggiare o ritardare la chiamata ai soccorsi
- Non far intendere di essere un professionista sanitario
- Non chiudere bruscamente in situazione critica
