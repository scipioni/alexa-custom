version: '3'

vars:
  # Dataset output (produced by download, consumed by train)
  DATA_DIR: ./data/italian/combined

  # Model variants
  TINY:   tiny-streaming
  MEDIUM: medium-streaming

  # Per-variant output roots
  TINY_OUT:   ./output/moonshine-it-tiny-streaming
  MEDIUM_OUT: ./output/moonshine-it-medium-streaming

tasks:

  # ── Dataset ──────────────────────────────────────────────────────────────

  download:
    desc: "Download Italian speech datasets (FLEURS + Common Voice). Set HF_TOKEN env var for Common Voice."
    cmds:
      - |
        if [ -n "${HF_TOKEN:-}" ]; then
          python download_dataset.py \
            --sources common_voice fleurs \
            --hf-token "$HF_TOKEN" \
            --output-dir ./data/italian
        else
          echo "HF_TOKEN not set — downloading FLEURS only (~10h). Set HF_TOKEN for Common Voice (~210h)."
          python download_dataset.py \
            --sources fleurs \
            --output-dir ./data/italian
        fi

  download:full:
    desc: "Download all Italian sources including MLS (~440h). Requires HF_TOKEN."
    cmds:
      - python download_dataset.py \
          --sources common_voice fleurs mls \
          --hf-token "$HF_TOKEN" \
          --output-dir ./data/italian

  # ── Training ─────────────────────────────────────────────────────────────

  train:tiny:
    desc: "Fine-tune moonshine-tiny-streaming on Italian (export ONNX when done)"
    cmds:
      - python train.py \
          --dataset-dir {{.DATA_DIR}} \
          --model {{.TINY}} \
          --output-dir {{.TINY_OUT}} \
          --export-onnx \
          {{.CLI_ARGS}}

  train:medium:
    desc: "Fine-tune moonshine-medium-streaming on Italian (export ONNX when done)"
    cmds:
      - python train.py \
          --dataset-dir {{.DATA_DIR}} \
          --model {{.MEDIUM}} \
          --output-dir {{.MEDIUM_OUT}} \
          --export-onnx \
          {{.CLI_ARGS}}

  train:tiny:resume:
    desc: "Resume tiny-streaming training from the latest phase checkpoint"
    vars:
      CKPT:
        sh: ls -1d {{.TINY_OUT}}/phase-*/checkpoint-* 2>/dev/null | sort -t- -k2 -n | tail -1
    cmds:
      - |
        if [ -z "{{.CKPT}}" ]; then
          echo "No checkpoint found in {{.TINY_OUT}} — run 'task train:tiny' first."
          exit 1
        fi
        echo "Resuming from {{.CKPT}}"
        python train.py \
          --dataset-dir {{.DATA_DIR}} \
          --model {{.TINY}} \
          --output-dir {{.TINY_OUT}} \
          --resume-from-checkpoint {{.CKPT}} \
          --export-onnx \
          {{.CLI_ARGS}}

  train:medium:resume:
    desc: "Resume medium-streaming training from the latest phase checkpoint"
    vars:
      CKPT:
        sh: ls -1d {{.MEDIUM_OUT}}/phase-*/checkpoint-* 2>/dev/null | sort -t- -k2 -n | tail -1
    cmds:
      - |
        if [ -z "{{.CKPT}}" ]; then
          echo "No checkpoint found in {{.MEDIUM_OUT}} — run 'task train:medium' first."
          exit 1
        fi
        echo "Resuming from {{.CKPT}}"
        python train.py \
          --dataset-dir {{.DATA_DIR}} \
          --model {{.MEDIUM}} \
          --output-dir {{.MEDIUM_OUT}} \
          --resume-from-checkpoint {{.CKPT}} \
          --export-onnx \
          {{.CLI_ARGS}}

  # ── ONNX → ORT (non-streaming, ModelArch.TINY) ───────────────────────────

  export:ort:tiny:
    desc: "Convert tiny-streaming ONNX → ORT and copy tokenizer.bin (ModelArch.TINY)"
    cmds:
      - python -m onnxruntime.tools.convert_onnx_models_to_ort
          --optimization_style Fixed
          {{.TINY_OUT}}/onnx/
      - |
        TOKENIZER=$(find ~/.cache/moonshine_voice -name tokenizer.bin | head -1)
        if [ -z "$TOKENIZER" ]; then
          echo "No tokenizer.bin in Moonshine cache. Downloading English model..."
          python -m moonshine_voice.download --language en
          TOKENIZER=$(find ~/.cache/moonshine_voice -name tokenizer.bin | head -1)
        fi
        cp "$TOKENIZER" {{.TINY_OUT}}/onnx/tokenizer.bin
        echo "Copied tokenizer.bin from $TOKENIZER"

  export:ort:medium:
    desc: "Convert medium-streaming ONNX → ORT and copy tokenizer.bin (ModelArch.TINY)"
    cmds:
      - python -m onnxruntime.tools.convert_onnx_models_to_ort
          --optimization_style Fixed
          {{.MEDIUM_OUT}}/onnx/
      - |
        TOKENIZER=$(find ~/.cache/moonshine_voice -name tokenizer.bin | head -1)
        if [ -z "$TOKENIZER" ]; then
          echo "No tokenizer.bin in Moonshine cache. Downloading English model..."
          python -m moonshine_voice.download --language en
          TOKENIZER=$(find ~/.cache/moonshine_voice -name tokenizer.bin | head -1)
        fi
        cp "$TOKENIZER" {{.MEDIUM_OUT}}/onnx/tokenizer.bin
        echo "Copied tokenizer.bin from $TOKENIZER"

  # ── Streaming export (ModelArch.TINY_STREAMING / MEDIUM_STREAMING) ───────

  export:streaming:tiny:
    desc: "Export tiny-streaming to 5-component streaming ORT format (ModelArch.TINY_STREAMING)"
    cmds:
      - python export_streaming.py \
          --model-dir {{.TINY_OUT}}/final \
          --output-dir {{.TINY_OUT}}/streaming

  export:streaming:medium:
    desc: "Export medium-streaming to 5-component streaming ORT format (ModelArch.MEDIUM_STREAMING)"
    cmds:
      - python export_streaming.py \
          --model-dir {{.MEDIUM_OUT}}/final \
          --output-dir {{.MEDIUM_OUT}}/streaming

  # ── Convenience pipelines ─────────────────────────────────────────────────

  all:tiny:
    desc: "Full pipeline: download → train tiny → export ORT + streaming"
    cmds:
      - task: download
      - task: train:tiny
      - task: export:ort:tiny
      - task: export:streaming:tiny

  all:medium:
    desc: "Full pipeline: download → train medium → export ORT + streaming"
    cmds:
      - task: download
      - task: train:medium
      - task: export:ort:medium
      - task: export:streaming:medium

  # ── Inference ─────────────────────────────────────────────────────────────

  run:tiny:
    desc: "Transcribe microphone in Italian — tiny model, non-streaming (ModelArch.TINY)"
    cmds:
      - python mic_transcriber_it.py --model-dir {{.TINY_OUT}}/onnx {{.CLI_ARGS}}

  run:tiny:streaming:
    desc: "Transcribe microphone in Italian — tiny model, streaming (ModelArch.TINY_STREAMING)"
    cmds:
      - python mic_transcriber_it.py --model-dir {{.TINY_OUT}}/streaming --streaming {{.CLI_ARGS}}

  run:medium:
    desc: "Transcribe microphone in Italian — medium model, non-streaming (ModelArch.TINY)"
    cmds:
      - python mic_transcriber_it.py --model-dir {{.MEDIUM_OUT}}/onnx {{.CLI_ARGS}}

  run:medium:streaming:
    desc: "Transcribe microphone in Italian — medium model, streaming (ModelArch.MEDIUM_STREAMING)"
    cmds:
      - python mic_transcriber_it.py --model-dir {{.MEDIUM_OUT}}/streaming --streaming {{.CLI_ARGS}}
