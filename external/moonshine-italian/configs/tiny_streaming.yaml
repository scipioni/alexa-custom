# Moonshine tiny-streaming Italian fine-tuning config
# Target: UsefulSensors/moonshine-tiny-streaming (34M params)
# Hardware: RTX 3060 (12 GB) or similar; ~12h training on ~100h Italian audio

model: tiny-streaming

# Dataset (output of download_dataset.py)
dataset_dir: ./data/italian/combined

# Output directory
output_dir: ./output/moonshine-it-tiny-streaming

# Training hyperparameters
per_device_batch_size: 8
gradient_accumulation: 8          # effective batch = 64
learning_rate: 3.0e-4
warmup_steps: 500
eval_steps: 500
max_steps: 10000                   # ~10 epochs on 100h dataset

# Memory
gradient_checkpointing: true
fp16: true                         # use bf16: true on Ampere+ (RTX 30xx/40xx/A100)

# Curriculum learning phases
# Phase 1: short clips (0.5–6s)   — 2000 steps
# Phase 2: medium clips (2–12s)   — 4000 steps
# Phase 3: full range (0.5–20s)   — remaining steps
skip_curriculum: false

# Encoder freezing (faster, less VRAM, lower accuracy)
freeze_encoder: false

# Export
export_onnx: true
tensorboard: true
seed: 42
