# go-task (https://taskfile.dev) — single command surface for both run modes.
# It only shells out to the same uv/docker commands documented in the README, so
# the two modes stay identical to running the commands by hand.
version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Native (uv) ──────────────────────────────────────────────────────────
  setup:
    desc: "Native: create the Python 3.13 venv and install the frozen lockfile"
    cmds:
      # Same lock-frozen verb as every other install path (NOT `uv pip install -e .`),
      # so this can never silently re-resolve dependency ranges.
      - uv venv --python 3.13
      - uv sync --frozen

  run:
    desc: "Native: run the service (uv-managed .venv)"
    cmds:
      - uv run onvif-sua

  test:
    desc: "Run the pytest suite"
    cmds:
      - uv run --frozen pytest

  lint:
    desc: "Ruff check (correctness ruleset — see pyproject [tool.ruff])"
    cmds:
      - uv run --frozen ruff check onvif_sua tests

  fix:
    desc: "Ruff auto-fix + test"
    cmds:
      - uv run --frozen ruff check --fix onvif_sua tests
      - uv run --frozen pytest

  clean:
    desc: "Native: remove the local virtualenv"
    cmds:
      - rm -rf .venv

  # ── Packaging (wheel + pinned constraints) ──────────────────────────────────
  build:
    desc: "Build the wheel + sdist into dist/ and refresh the pinned requirements.lock"
    cmds:
      # Pin the exact dependency graph from uv.lock (project excluded — the wheel
      # provides it) so `pip install <wheel> -c requirements.lock` on the target
      # reproduces the same versions the venv/Docker resolve.
      - uv export --frozen --no-emit-project --no-dev --no-hashes -o requirements.lock
      # Build the distributables into dist/ (the wheel ships templates + static).
      - uv build

  install:
    desc: "Install the built wheel into the uv-managed venv (pinned by requirements.lock)"
    cmds:
      # Installs the newest wheel from dist/ (run `task build` first). Pinned by
      # requirements.lock so it resolves the same versions as setup/Docker.
      - |
        set -e
        WHEEL=$(ls -t dist/onvif_sua-*.whl 2>/dev/null | head -1)
        if [ -z "$WHEEL" ]; then
          echo "!! No wheel in dist/ — run 'task build' first." >&2
          exit 1
        fi
        echo ">> Installing $WHEEL"
        uv pip install --upgrade "$WHEEL" -c requirements.lock

  remove:
    desc: "Uninstall the package from the uv-managed venv"
    cmds:
      - uv pip uninstall onvif-sua

  install:systemd:
    desc: "Install as a systemd --user service running in place from this checkout's uv venv (same layout as ../setup/serena.service: no sudo, no dedicated user, no /opt install)"
    cmds:
      - |
        set -e
        if [ ! -x .venv/bin/onvif-sua ]; then
          echo "!! .venv/bin/onvif-sua missing — run 'task setup' first." >&2
          exit 1
        fi
        mkdir -p ~/.config/systemd/user
        cp onvif-sua-user.service ~/.config/systemd/user/onvif-sua.service
        systemctl --user daemon-reload
        systemctl --user enable onvif-sua
        echo
        echo ">> Installed. NOT started yet — make sure settings.yaml/.env are in place"
        echo "   (see 'task setup' / .env.example) then:"
        echo "   1) systemctl --user start   onvif-sua"
        echo "   2) systemctl --user status  onvif-sua"
        echo "   3) journalctl --user -fu    onvif-sua"

  uninstall:systemd:
    desc: "Remove the systemd --user service (keeps this checkout, settings.yaml, .env, data/)"
    cmds:
      - |
        set -e
        echo ">> Stopping + disabling onvif-sua"
        # `|| true`: succeed even if the service was never enabled/installed.
        systemctl --user disable --now onvif-sua 2>/dev/null || true
        rm -f ~/.config/systemd/user/onvif-sua.service
        systemctl --user daemon-reload
        systemctl --user reset-failed onvif-sua 2>/dev/null || true
        echo ">> Service removed (checkout/config/.env/data untouched)."

  # ── Docker ─────────────────────────────────────────────────────────────────
  docker:build:
    desc: "Docker: build the image"
    cmds:
      - docker compose build

  docker:up:
    desc: "Docker: start the container (detached)"
    cmds:
      - docker compose up -d

  docker:down:
    desc: "Docker: stop and remove the container"
    cmds:
      - docker compose down

  docker:logs:
    desc: "Docker: follow container logs"
    cmds:
      - docker compose logs -f

  docker:restart:
    desc: "Docker: restart (picks up code edits via the bind-mount, no rebuild)"
    cmds:
      - docker compose restart
