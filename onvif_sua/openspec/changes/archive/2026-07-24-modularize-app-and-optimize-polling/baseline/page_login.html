<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONVIF Events — Accesso</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
  body{background:#0d1117;color:#c9d1d9;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#161b22;border:1px solid #30363d;width:100%;max-width:340px}
  .card-header{background:#21262d;border-bottom:1px solid #30363d;color:#58a6ff}
  .form-control{background:#0d1117;color:#c9d1d9;border-color:#30363d}
  .form-control:focus{background:#0d1117;color:#c9d1d9;border-color:#58a6ff;box-shadow:0 0 0 .2rem #58a6ff33}
  .btn-primary{background:#1f6feb;border-color:#1f6feb}
  .text-muted{color:#adbac7!important}
  .btn-outline-secondary{color:#adbac7;border-color:#57606a}
  .btn-outline-secondary:hover{color:#fff;background:#30363d;border-color:#57606a}
  ::placeholder{color:#8b949e!important;opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="card-header text-center py-3">🔒 ONVIF Events — Impostazioni</div>
  <div class="card-body p-4">
    <div class="mb-3">
      <label class="form-label small" style="color:#adbac7">Password</label>
      <input type="password" class="form-control" id="pwd" placeholder="••••••••" autofocus>
    </div>
    <button class="btn btn-primary w-100" onclick="doLogin()">Accedi</button>
    <div id="msg" class="mt-3 small text-center"></div>
    <div class="mt-3 text-center">
      <a href="/" class="btn btn-sm btn-outline-secondary w-100">← Dashboard</a>
    </div>
  </div>
</div>
<script>
async function doLogin(){
  const pwd = document.getElementById('pwd').value;
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pwd})});
    if(r.ok){ window.location='/'; return; }
    const j = await r.json();
    document.getElementById('msg').innerHTML='<span style="color:#f85149">'+( j.detail||'Errore')+'</span>';
    document.getElementById('pwd').value='';
    document.getElementById('pwd').focus();
  }catch(e){ document.getElementById('msg').textContent='Errore rete'; }
}
document.getElementById('pwd').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
