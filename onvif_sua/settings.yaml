# settings.yaml — file di configurazione unico (modificabile dalla GUI).
# Le password (telecamere / scan / login GUI) NON stanno qui: vivono in .env.
# Il blocco 'cameras' è la lista statica delle telecamere (vedi settings.yaml.example).
mqtt:
  host: localhost
  port: 1883
  user: ''
  pass: ''
  prefix: onvif
scan:
  subnet: 10.1.109.0/24
  concurrency: 48
  rescan_time_interval: 0  #under 60 will be forced to 60
cameras:
  credentials:
    port: 80
  list:
  - ip: 10.1.109.99
    name: bagno
#  - hostname: cucina1
#    name: cucina1
#  - hostname: bagno2
#    name: bagno2
#  - hostname: cucina2
#    name: cucina2
#  - hostname: bagno3
#    name: bagno3
#  - hostname: cucina3
#    name: cucina3
#  - hostname: soggiorno1
#    name: soggiorno1

web:
  asset_version: '4'
  port: 8081
tuning:
  liveness_mode: heartbeat
  heartbeat_interval: 15
  heartbeat_gap_factor: 3
  rule_check_interval: 300
  keepalive_interval: 30
  save_interval: 120
serena:
  enabled: true
  topic_prefix: serena
  node_id: "" # set to hostname when empty
  command_template: caduta_{cam_name}
  announce_ready: true
  announce_template: sensore uomo a terra {cam_name} attivo
  announce_fault: false
  announce_fault_template: attenzione, sensore uomo a terra {cam_name} non attivo
  announce_fault_interval_s: 300
  announce_fault_grace_s: 60
  startup_alarm_max_age_s: 300
