# Prevent WirePlumber from suspending USB audio nodes (device-agnostic).
#
# - input: keeps capture nodes active so GStreamer/PulseAudio clients connect
#   without the brief SUSPENDED delay when the STT pipeline starts.
# - output: Bluetooth-dongle devices (e.g. Yealink BT51) drop their radio
#   audio link when the sink suspends; keeping the sink alive also stops the
#   default sink from falling back to HDMI while nothing is playing.
#
# "~" prefix = regex match; "alsa_(input|output).usb-" covers every USB audio
# device (NewPie, Yealink, EMEET, ...) without hardcoding product names.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-.*" }
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
