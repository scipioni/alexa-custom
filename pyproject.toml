[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alexa-custom"
version = "0.3.0"
description = "LiveKit headless audio client for Bluetooth conference speakerphones"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "livekit>=1.1.10",
    "livekit-api>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "pulsectl>=23.0.0",
    "vosk>=0.3.45",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiomqtt>=2.5.1",
    "aiohttp>=3.9",
    "piper-tts>=1.2.0",
    "sherpa-onnx>=1.0.0",
    "rapidfuzz>=3.0.0",
    "ruamel.yaml>=0.18",
    "smbus2>=0.6.1",
]

[project.scripts]
alexa-client = "alexa_custom.client:main"
alexa-audio = "alexa_custom.audio:main"
alexa-devices = "alexa_custom.audio:main_devices"
alexa-test = "alexa_custom.audio:main_test"
alexa-setup = "alexa_custom.setup:main"
alexa-audio-setup = "alexa_custom.audio:setup_audio"
alexa-wake-eval = "alexa_custom.wake_eval:main"
alexa-record = "alexa_custom.record:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alexa_custom*"]

[project.optional-dependencies]
i2c = ["smbus2>=0.4.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "smbus2>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers are declared explicitly; keep strict mode so a forgotten
# @pytest.mark.asyncio surfaces instead of silently passing.
asyncio_mode = "strict"

[tool.ruff]
target-version = "py313"

[tool.pyright]
# Introduced on an existing codebase: run in basic mode and surface findings
# without blocking CI yet (the type-check job is non-blocking). Drive the
# error count to zero over time, then flip the job to required.
include = ["alexa_custom"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = false
