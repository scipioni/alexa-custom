# Prevent WirePlumber from suspending USB audio nodes.
#
# Keeps capture nodes always active so GStreamer clients connect without delay.
# For Yealink BT51, also keeps the OUTPUT node alive: without this, WirePlumber
# suspends and removes the analog-stereo sink when nothing is playing, causing
# the default sink to fall back to HDMI and breaking the doctor routing check.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-*_NewPie_*" }
      { node.name = "~alsa_input.usb-*Yealink*" }
      { node.name = "~alsa_output.usb-*Yealink*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
