# Prevent WirePlumber from suspending USB audio source nodes.
#
# Keeps the capture node always active so GStreamer clients
# (pipewiresrc, pulsesrc) connect without waiting for WirePlumber to wake it
# from SUSPENDED. Without this, the first buffer after a restart is delayed.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-*_NewPie_*" }
      { node.name = "~alsa_input.usb-*Yealink*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
