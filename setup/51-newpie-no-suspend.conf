# Prevent WirePlumber from suspending the NewPie ALSA source node.
#
# When a native PipeWire client (e.g. pipewiresrc GStreamer element) connects
# to the NewPie, WirePlumber does not drive the node out of SUSPENDED state
# the way the PulseAudio compat socket does. Setting suspend-timeout-seconds=0
# keeps the node always active so native clients get data immediately.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.usb-0a12_NewPie_SABINESMICDFU-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
