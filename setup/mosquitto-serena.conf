# Serena drop-in: anonymous access, bind all interfaces
listener 1883 0.0.0.0
allow_anonymous true

# ===========================================================================
# OPTIONAL: MQTT Bridge Configuration (Multi-device / Centralized setups)
# ===========================================================================
# Un-comment and configure the section below to connect this local Mosquitto
# broker as a client of a central master broker, enabling bi-directional 
# forwarding of state, commands, and TTS requests.
#
# connection central_master_bridge
# address primary-master.com:1883 secondary-master.com:1883
# (Note: You can specify multiple space-separated addresses for automatic redundant failover!)
#
# Optional authentication credentials:
# username your_username
# password your_password
#
# start_type automatic
# restart_timeout 10
# notifications true
# cleansession false
#
# --- Bridging Topic Rules ---
# Syntax: topic <pattern> <direction> <qos> <local-prefix> <remote-prefix>
# Direction: 'both' (forward + receive), 'out' (only publish), 'in' (only subscribe)
#
# 1. Bi-directional bridge for this specific board's topics.
# REPLACE 'living_room' with your local unique node_id configured in config.yaml!
# topic serena/living_room/# both 0
#
# 2. (Optional) Forward Home Assistant auto-discovery configs to register on a remote HA instance.
# topic homeassistant/# out 0

