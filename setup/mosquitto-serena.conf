# Serena drop-in: anonymous access, bind all interfaces
listener 1883 0.0.0.0
allow_anonymous true

# Queue QoS 0 messages for disconnected persistent clients. REQUIRED for the
# bridge to buffer anything: the Serena daemon publishes at QoS 0 (aiomqtt
# default, see alexa_custom/mqtt.py), and MQTT downgrades delivery to
# min(publish QoS, subscription QoS) — so a QoS 1 bridge topic on its own queues
# nothing. Measured across a master outage: 0/5 messages survived without this
# option, 5/5 with it. Counts against max_queued_messages (default 1000).
queue_qos0_messages true

# ===========================================================================
# Bridge to the central master broker
# ===========================================================================
# NOT configured here — the bridge needs a password and this file is committed.
# It lives in setup/mosquitto-bridge.conf.template, which `task mqtt:bridge-setup`
# renders with the credentials from conf/secrets.yaml (git-ignored) into
# /etc/mosquitto/conf.d/serena-bridge.conf (owner mosquitto, mode 640).
#
# The whole `connection` block has to stay in that single file: mosquitto tracks
# the current bridge per config file, so splitting `username`/`password` into a
# separate conf.d drop-in fails to start with "Error: Invalid bridge
# configuration" (verified on mosquitto 2.x).
