# Labelled corpus for the text-level matching harness (alexa_custom/match_eval.py).
#
# Each case is a simulated STT transcript with the expected outcome:
#   expect: none          -> system must stay silent (negative / must not fire)
#   expect: wake          -> a wake word fires, no command dispatched
#   expect: "<phrase>"    -> a command trigger fires (via one-breath or direct)
# Optional: woken: true   -> evaluate as if the wake window is already open.
#
# Add real-world false wakes here as you encounter them — this file is the
# regression gate (tests/test_match_eval.py) and the tuning input (--sweep).

wake_words:
  - "ehi galileo"
  - "assistente"

stt:
  wake_match_threshold: 0.5

recognition:
  matching_threshold: 75.0
  matching_algorithm: token_sort_ratio
  min_word_overlap: 0.0

triggers:
  - commands: ["che ore sono", "che ora è"]
    with_wake: true
  - commands: ["accendi la luce"]
    with_wake: true
  - commands: ["chiama stefano"]
    with_wake: false

cases:
  # ── positives: wake word present ───────────────────────────────────────────
  - {text: "ehi galileo", expect: wake}
  - {text: "ehi galileo che ore sono", expect: "che ore sono"}
  - {text: "ehi galileo accendi la luce", expect: "accendi la luce"}
  - {text: "assistente", expect: wake}
  - {text: "galileo", expect: wake, note: "truncated wake — distinctive word"}
  - {text: "galile", expect: wake, note: "STT truncation of galileo"}
  - {text: "assistent", expect: wake, note: "STT truncation of assistente"}
  - {text: "ei galileo", expect: wake, note: "STT drops silent 'h' in 'ehi' -> 'ei' (real 2026-07-13 log)"}
  - {text: "assiste", expect: wake, note: "STT truncation cutting off '-nte' of assistente (real 2026-07-13 log)"}

  # ── positives: command matching ────────────────────────────────────────────
  - {text: "chiama stefano", expect: "chiama stefano", note: "direct trigger, no wake"}
  - {text: "puoi chiamare stefano", expect: "chiama stefano", note: "inflected, direct"}
  - {text: "che ore sono", expect: "che ore sono", woken: true}
  - {text: "accendi la luce", expect: "accendi la luce", woken: true}

  # ── negatives: short wake-component only (the false-wake class #1 targets) ──
  - {text: "ehi come stai oggi", expect: none, note: "filler 'ehi' alone"}
  - {text: "ehi aspetta un attimo", expect: none, note: "filler 'ehi' alone"}
  - {text: "ehi guarda lì", expect: none, note: "filler 'ehi' alone"}
  - {text: "ehi ci vediamo dopo", expect: none, note: "filler 'ehi' alone"}

  # ── negatives: near-misses and unrelated speech ────────────────────────────
  - {text: "gabriele vieni qui", expect: none, note: "near-miss name"}
  - {text: "il galileo", expect: none, note: "keyword embedded in speech, not an address"}
  - {text: "abbiamo studiato galileo a scuola", expect: none, note: "keyword mid-conversation"}
  - {text: "ho assistito alla partita", expect: none, note: "shares stem with assistente"}
  - {text: "il gatto dorme sul divano", expect: none}
  - {text: "che bella giornata oggi", expect: none}
  - {text: "ho fame andiamo a mangiare", expect: none}
  - {text: "domani piove di sicuro", expect: none}
  - {text: "non capisco cosa vuoi dire", expect: none}
  - {text: "spegni la televisione per favore", expect: none, note: "command-shaped but not configured"}

  # ── negatives: gating (configured but should not fire in this context) ─────
  - {text: "che ore sono", expect: none, note: "gated trigger, NOT woken"}
  - {text: "accendi la luce", expect: none, note: "gated trigger, NOT woken"}

  # ── negatives: single content-word subsets of a command (token_set_ratio FP
  #    class — a bare word inside a longer phrase must NOT fire the command). ──
  - {text: "sono", expect: none, woken: true, note: "subset of 'che ore sono'"}
  - {text: "ore", expect: none, woken: true, note: "subset of 'che ore sono'"}
  - {text: "luce", expect: none, woken: true, note: "subset of 'accendi la luce'"}
  - {text: "la luce", expect: none, woken: true, note: "subset of 'accendi la luce'"}
  - {text: "chiama", expect: none, woken: true, note: "bare verb, not a full command"}

  # ── positives: word-order / dropped-word tolerance (token_sort handles these) ─
  - {text: "ore sono", expect: "che ore sono", woken: true, note: "dropped 'che'"}
  - {text: "sono le ore", expect: "che ore sono", woken: true, note: "reordered"}
  - {text: "accendi luce", expect: "accendi la luce", woken: true, note: "dropped 'la'"}
